<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>အအေးမီနူး အော်ဒါမှာရန်</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --primary: #0088cc; --bg: #f4f6f8; }
    body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
    .card { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    h2, h3 { margin-top: 0; color: var(--primary); }
    .item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
    button { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
    button:disabled { background: #ccc; }
    input, select { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
    .hidden { display: none; }
    .qr-img { width: 200px; height: auto; display: block; margin: 10px auto; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🥤 အအေးမီနူး</h2>
    <div id="menu-list"></div>
  </div>

  <div class="card">
    <h3>🛒 ရွေးချယ်ထားသော အော်ဒါများ</h3>
    <div id="cart-list">မရှိသေးပါ</div>
    <p><strong>စုစုပေါင်း: <span id="total-price">0</span> ကျပ်</strong></p>
  </div>

  <div class="card">
    <h3>📋 အော်ဒါအချက်အလက်</h3>
    <label>Telegram Username</label>
    <input type="text" id="tg-username" placeholder="@username" readonly>

    <label>ဖုန်းနံပါတ်</label>
    <input type="tel" id="phone" placeholder="09xxxxxxxxx">

    <label>ပေးချေမှုပုံစံ</label>
    <select id="payment-method" onchange="togglePaymentUI()">
      <option value="cash">ငွေသား (Cash on Delivery)</option>
      <option value="qr">QR Payment (KBZPay / WavePay)</option>
    </select>

    <div id="qr-section" class="hidden">
      <p style="text-align: center; color: #666;">အောက်ပါ QR ကို စကင်ဖတ်၍ ငွေလွှဲပါ</p>
      <!-- မိမိတို့၏ QR ဓာတ်ပုံ Link ကို အောက်ပါ src တွင် ပြောင်းပေးပါ -->
      <img src="https://via.placeholder.com/200x200.png?text=Shop+QR+Code" alt="Payment QR" class="qr-img">
      <label>ငွေလွှဲပြေစာ (Slip) တင်ပါ</label>
      <input type="file" id="slip-file" accept="image/*">
    </div>

    <button id="submit-btn" onclick="submitOrder()" style="width: 100%; margin-top: 15px; padding: 12px; font-size: 16px;">အော်ဒါတင်မည်</button>
  </div>

  <script>
    // -----------------------------------------------------------
    // CONFIGURATION (ဆိုင်ဖက်မှ ဖြည့်စွက်ရန် လျှို့ဝှက်အချက်အလက်များ)
    // -----------------------------------------------------------
    const BOT_TOKEN = "YOUR_BOT_TOKEN_HERE"; // တကယ့် Bot Token ထည့်ပါ
    const CHAT_ID = "YOUR_CHAT_ID_HERE";     // အော်ဒါဝင်မယ့် Group/Channel/Admin Chat ID ထည့်ပါ

    const menu = [
      { id: 1, name: "Bubble Milk Tea", price: 3500 },
      { id: 2, name: "Iced Americano", price: 2500 },
      { id: 3, name: "Matcha Latte", price: 4000 },
      { id: 4, name: "Mango Smoothie", price: 3000 }
    ];

    let cart = {};
    const tg = window.Telegram?.WebApp;

    // Telegram Username အလိုအလျောက် ရယူခြင်း
    document.addEventListener("DOMContentLoaded", () => {
      if (tg) {
        tg.ready();
        const user = tg.initDataUnsafe?.user;
        if (user) {
          const username = user.username ? `@${user.username}` : `ID: ${user.id} (${user.first_name})`;
          document.getElementById('tg-username').value = username;
        } else {
          document.getElementById('tg-username').value = "@unknown_user";
        }
      }
      renderMenu();
    });

    function renderMenu() {
      const menuContainer = document.getElementById('menu-list');
      menuContainer.innerHTML = menu.map(item => `
        <div class="item">
          <div>
            <strong>${item.name}</strong><br>
            <small>${item.price} ကျပ်</small>
          </div>
          <button onclick="addToCart(${item.id})">+ ထည့်မည်</button>
        </div>
      `).join('');
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateCartUI();
    }

    function updateCartUI() {
      const cartContainer = document.getElementById('cart-list');
      let total = 0;
      let itemsHtml = '';

      for (const id in cart) {
        const item = menu.find(m => m.id == id);
        const itemTotal = item.price * cart[id];
        total += itemTotal;
        itemsHtml += `<div>${item.name} x ${cart[id]} = ${itemTotal} ကျပ်</div>`;
      }

      cartContainer.innerHTML = itemsHtml || 'မရှိသေးပါ';
      document.getElementById('total-price').innerText = total;
    }

    function togglePaymentUI() {
      const method = document.getElementById('payment-method').value;
      const qrSection = document.getElementById('qr-section');
      if (method === 'qr') {
        qrSection.classList.remove('hidden');
      } else {
        qrSection.classList.add('hidden');
      }
    }

    async function submitOrder() {
      const username = document.getElementById('tg-username').value;
      const phone = document.getElementById('phone').value;
      const payMethod = document.getElementById('payment-method').value;
      const slipFile = document.getElementById('slip-file').files[0];

      if (Object.keys(cart).length === 0) {
        alert("ကျေးဇူးပြု၍ မီနူး အနည်းဆုံးတစ်ခု ရွေးချယ်ပါ။");
        return;
      }
      if (!phone) {
        alert("ကျေးဇူးပြု၍ ဖုန်းနံပါတ် ဖြည့်စွက်ပါ။");
        return;
      }
      if (payMethod === 'qr' && !slipFile) {
        alert("ကျေးဇူးပြု၍ ငွေလွှဲပြေစာ (Slip) ဓာတ်ပုံ တင်ပေးပါ။");
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = "အော်ဒါပို့နေသည်...";

      let orderText = `🛒 **အော်ဒါအသစ် ရရှိပါသည်!**\n\n`;
      orderText += `👤 **အသုံးပြုသူ:** ${username}\n`;
      orderText += `📞 **ဖုန်းနံပါတ်:** ${phone}\n`;
      orderText += `💳 **ပေးချေမှု:** ${payMethod === 'cash' ? 'ငွေသား (Cash on Delivery)' : 'QR Payment'}\n\n`;
      orderText += `📝 **မှာယူထားသော စာရင်း:**\n`;

      let total = 0;
      for (const id in cart) {
        const item = menu.find(m => m.id == id);
        const itemTotal = item.price * cart[id];
        total += itemTotal;
        orderText += `- ${item.name} x ${cart[id]} (${itemTotal} ကျပ်)\n`;
      }
      orderText += `\n💰 **စုစုပေါင်း ကျသင့်ငွေ:** ${total} ကျပ်`;

      try {
        if (payMethod === 'cash') {
          // ငွေသားဆိုလျှင် Text Message ချက်ချင်း ပို့မည်
          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              chat_id: CHAT_ID,
              text: orderText,
              parse_mode: 'Markdown'
            })
          });
        } else {
          // QR Payment ဆိုလျှင် Slip ဓာတ်ပုံနှင့်အတူ စာပါ တစ်ခါတည်း ပို့မည်
          const formData = new FormData();
          formData.append('@username', user_ID);
          formData.append('caption', orderText);
          formData.append('parse_mode', 'Markdown');
          formData.append('photo', slipFile);

          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
        }

        alert("အော်ဒါ တင်ပြီးပါပြီ။ ကျေးဇူးတင်ပါသည်။");
        cart = {};
        updateCartUI();
        if (tg) tg.close();
      } catch (err) {
        alert("အော်ဒါတင်ခြင်း မအောင်မြင်ပါ။ ပြန်လည်ကြိုးစားပါ။");
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = "အော်ဒါတင်မည်";
      }
    }
  </script>
</body>
</html>
