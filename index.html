<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>茶韵 · 高级奶茶点单</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ========== 完整样式（与之前完全一致，保留所有高级设计） ========== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0b0b1a; color:#f0ece4; font-family:'Segoe UI','PingFang SC',Roboto,sans-serif; min-height:100vh; }
        .container { max-width:480px; margin:0 auto; padding:16px 16px 100px; }
        .page { display:none; animation:fadeUp 0.4s ease; }
        .page.active { display:block; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
        .gold-text { color:#d4af37; }
        .glass-card { background:rgba(22,22,46,0.85); backdrop-filter:blur(12px); border:1px solid rgba(212,175,55,0.25); border-radius:20px; padding:20px; box-shadow:0 12px 40px rgba(0,0,0,0.6); }
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 28px; border:none; border-radius:50px; font-size:16px; font-weight:600; cursor:pointer; transition:all 0.25s ease; width:100%; }
        .btn-primary { background:linear-gradient(135deg,#d4af37,#b8962e); color:#0b0b1a; box-shadow:0 6px 24px rgba(212,175,55,0.3); }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 10px 32px rgba(212,175,55,0.45); }
        .btn-secondary { background:rgba(255,255,255,0.06); color:#f0ece4; border:1px solid rgba(255,255,255,0.12); }
        .btn-danger { background:rgba(180,40,40,0.7); color:#fff; }
        .btn-success { background:linear-gradient(135deg,#2d8f4e,#1f6b3a); color:#fff; }
        .btn-sm { padding:10px 18px; font-size:14px; width:auto; }
        .input-group { margin-bottom:18px; }
        .input-group label { display:block; font-size:13px; font-weight:500; color:#a0a0b8; margin-bottom:6px; }
        .input-group input, .input-group textarea, .input-group select { width:100%; padding:14px 18px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:14px; color:#f0ece4; font-size:15px; transition:all 0.3s ease; outline:none; font-family:inherit; }
        .input-group input:focus, .input-group textarea:focus { border-color:#d4af37; background:rgba(255,255,255,0.08); box-shadow:0 0 0 4px rgba(212,175,55,0.08); }
        .badge { display:inline-block; padding:4px 12px; border-radius:50px; font-size:12px; font-weight:600; }
        .badge-gold { background:rgba(212,175,55,0.2); color:#d4af37; }
        .badge-green { background:rgba(45,143,78,0.2); color:#4cdb7c; }
        .badge-red { background:rgba(180,40,40,0.2); color:#f06a6a; }
        .badge-orange { background:rgba(212,136,58,0.2); color:#e8a84c; }
        .top-bar { display:flex; justify-content:space-between; align-items:center; padding:16px 0 12px; position:sticky; top:0; background:rgba(11,11,26,0.92); backdrop-filter:blur(16px); z-index:50; border-bottom:1px solid rgba(212,175,55,0.08); }
        .top-bar .brand { display:flex; align-items:center; gap:10px; font-size:22px; font-weight:700; letter-spacing:1px; }
        .top-bar .brand i { color:#d4af37; font-size:26px; }
        .top-bar .brand span { background:linear-gradient(135deg,#f0d080,#b8962e); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .top-bar .actions button { background:rgba(255,255,255,0.06); border:none; color:#c0c0d0; width:40px; height:40px; border-radius:50%; font-size:18px; cursor:pointer; transition:all 0.25s ease; display:flex; align-items:center; justify-content:center; }
        .top-bar .actions button:hover { background:rgba(212,175,55,0.15); color:#d4af37; }
        .top-bar .actions .cart-btn { position:relative; }
        .top-bar .actions .cart-btn .count { position:absolute; top:-4px; right:-4px; background:#d4af37; color:#0b0b1a; font-size:11px; font-weight:700; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
        .category-tabs { display:flex; gap:10px; overflow-x:auto; padding:12px 0 16px; scrollbar-width:none; }
        .category-tabs::-webkit-scrollbar { display:none; }
        .category-tabs .tab { flex-shrink:0; padding:8px 20px; border-radius:50px; font-size:14px; font-weight:500; background:rgba(255,255,255,0.04); color:#a0a0b8; border:1px solid transparent; cursor:pointer; transition:all 0.3s ease; white-space:nowrap; }
        .category-tabs .tab:hover { background:rgba(255,255,255,0.08); color:#f0ece4; }
        .category-tabs .tab.active { background:rgba(212,175,55,0.15); color:#d4af37; border-color:rgba(212,175,55,0.3); }
        .menu-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:4px; }
        .menu-item { background:rgba(22,22,46,0.7); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.05); border-radius:18px; padding:16px 14px 14px; transition:all 0.3s ease; cursor:pointer; position:relative; overflow:hidden; }
        .menu-item::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,#d4af37,#f0d080); opacity:0; transition:opacity 0.3s ease; }
        .menu-item:hover { border-color:rgba(212,175,55,0.3); transform:translateY(-2px); box-shadow:0 8px 30px rgba(0,0,0,0.4); }
        .menu-item:hover::before { opacity:1; }
        .menu-item .icon { font-size:28px; margin-bottom:6px; display:block; }
        .menu-item .name { font-size:15px; font-weight:600; color:#f0ece4; margin-bottom:2px; }
        .menu-item .desc { font-size:12px; color:#8888a0; margin-bottom:8px; line-height:1.3; min-height:32px; }
        .menu-item .bottom { display:flex; justify-content:space-between; align-items:center; }
        .menu-item .price { font-size:17px; font-weight:700; color:#d4af37; }
        .menu-item .price small { font-size:12px; font-weight:400; color:#8888a0; }
        .menu-item .add-btn { width:32px; height:32px; border-radius:50%; border:none; background:rgba(212,175,55,0.15); color:#d4af37; font-size:18px; cursor:pointer; transition:all 0.25s ease; display:flex; align-items:center; justify-content:center; }
        .menu-item .add-btn:hover { background:#d4af37; color:#0b0b1a; transform:scale(1.05); }
        .cart-floating { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(22,22,46,0.95); backdrop-filter:blur(20px); border:1px solid rgba(212,175,55,0.2); border-radius:60px; padding:10px 20px 10px 24px; display:flex; align-items:center; gap:16px; box-shadow:0 12px 48px rgba(0,0,0,0.8); z-index:100; max-width:92%; transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1); }
        .cart-floating.hidden { transform:translateX(-50%) translateY(80px); opacity:0; pointer-events:none; }
        .cart-floating .info { display:flex; align-items:center; gap:12px; flex:1; }
        .cart-floating .info .count { background:rgba(212,175,55,0.15); color:#d4af37; padding:2px 12px; border-radius:50px; font-size:14px; font-weight:600; }
        .cart-floating .info .total { font-size:18px; font-weight:700; color:#f0ece4; }
        .cart-floating .info .total .currency { color:#d4af37; font-weight:400; }
        .cart-floating .checkout-btn { padding:10px 24px; border-radius:50px; border:none; background:linear-gradient(135deg,#d4af37,#b8962e); color:#0b0b1a; font-weight:700; font-size:15px; cursor:pointer; transition:all 0.25s ease; white-space:nowrap; }
        .cart-floating .checkout-btn:hover { transform:scale(1.04); box-shadow:0 6px 24px rgba(212,175,55,0.3); }
        .checkout-section { margin-top:8px; }
        .checkout-section .section-title { font-size:16px; font-weight:600; color:#d4af37; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
        .dining-options, .payment-options { display:flex; gap:12px; margin-bottom:16px; }
        .dining-options .option, .payment-options .option { flex:1; padding:14px; text-align:center; border-radius:14px; border:1px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.03); cursor:pointer; transition:all 0.25s ease; font-weight:500; font-size:14px; }
        .dining-options .option i, .payment-options .option i { display:block; font-size:22px; margin-bottom:4px; }
        .dining-options .option.active, .payment-options .option.active { border-color:#d4af37; background:rgba(212,175,55,0.08); color:#d4af37; }
        .upload-area { border:2px dashed rgba(212,175,55,0.2); border-radius:16px; padding:30px 20px; text-align:center; cursor:pointer; transition:all 0.3s ease; background:rgba(255,255,255,0.02); margin-bottom:16px; position:relative; }
        .upload-area:hover { border-color:#d4af37; background:rgba(212,175,55,0.04); }
        .upload-area i { font-size:36px; color:#d4af37; margin-bottom:8px; display:block; }
        .upload-area .hint { color:#8888a0; font-size:14px; }
        .upload-area img { max-width:100%; max-height:180px; border-radius:12px; margin-top:10px; }
        .upload-area .remove-img { position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.6); border:none; color:#fff; width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:14px; display:none; }
        .upload-area.has-img .remove-img { display:flex; align-items:center; justify-content:center; }
        .order-summary { background:rgba(255,255,255,0.04); border-radius:14px; padding:16px; margin:16px 0; }
        .order-summary .item-row { display:flex; justify-content:space-between; padding:6px 0; font-size:14px; border-bottom:1px solid rgba(255,255,255,0.04); }
        .order-summary .item-row:last-child { border-bottom:none; }
        .order-summary .total-row { display:flex; justify-content:space-between; padding:12px 0 4px; font-size:18px; font-weight:700; border-top:2px solid rgba(212,175,55,0.15); margin-top:6px; }
        .order-summary .total-row .price { color:#d4af37; }
        .admin-login { min-height:70vh; display:flex; flex-direction:column; justify-content:center; align-items:center; }
        .admin-login .lock-icon { font-size:64px; color:#d4af37; margin-bottom:20px; }
        .admin-panel .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:20px; }
        .admin-panel .stats .stat-item { background:rgba(255,255,255,0.04); border-radius:14px; padding:14px 10px; text-align:center; }
        .admin-panel .stats .stat-item .num { font-size:24px; font-weight:700; color:#d4af37; }
        .admin-panel .stats .stat-item .label { font-size:12px; color:#8888a0; margin-top:2px; }
        .order-list { display:flex; flex-direction:column; gap:12px; margin-top:12px; }
        .order-card { background:rgba(255,255,255,0.04); border-radius:16px; padding:16px; border:1px solid rgba(255,255,255,0.04); transition:all 0.25s ease; cursor:pointer; }
        .order-card:hover { border-color:rgba(212,175,55,0.15); background:rgba(255,255,255,0.06); }
        .order-card .top-row { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
        .order-card .top-row .customer { font-weight:600; font-size:15px; }
        .order-card .top-row .customer small { font-weight:400; color:#8888a0; font-size:13px; margin-left:6px; }
        .order-card .top-row .status { font-size:12px; font-weight:600; }
        .order-card .items-preview { font-size:13px; color:#a0a0b8; margin-bottom:6px; }
        .order-card .bottom-row { display:flex; justify-content:space-between; align-items:center; font-size:13px; color:#8888a0; }
        .order-card .bottom-row .total { font-weight:700; color:#d4af37; font-size:16px; }
        .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); z-index:200; display:none; align-items:center; justify-content:center; padding:20px; animation:fadeIn 0.3s ease; }
        .modal-overlay.show { display:flex; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        .modal-content { background:#1a1a2e; border-radius:24px; padding:28px 24px; max-width:440px; width:100%; max-height:90vh; overflow-y:auto; border:1px solid rgba(212,175,55,0.15); box-shadow:0 24px 80px rgba(0,0,0,0.8); animation:slideUp 0.35s cubic-bezier(0.34,1.56,0.64,1); }
        @keyframes slideUp { from { opacity:0; transform:translateY(40px) scale(0.96); } to { opacity:1; transform:translateY(0) scale(1); } }
        .modal-content .modal-title { font-size:20px; font-weight:700; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; }
        .modal-content .modal-title .close { background:none; border:none; color:#8888a0; font-size:24px; cursor:pointer; }
        .modal-content .detail-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:14px; }
        .modal-content .detail-row .label { color:#8888a0; }
        .modal-content .detail-row .value { color:#f0ece4; text-align:right; max-width:60%; word-break:break-all; }
        .modal-content .payment-image { margin:12px 0; border-radius:14px; overflow:hidden; background:rgba(0,0,0,0.3); }
        .modal-content .payment-image img { width:100%; display:block; }
        .modal-content .modal-actions { display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; }
        .modal-content .modal-actions .btn { flex:1; min-width:100px; }
        .settings-group { margin-top:16px; }
        .settings-group .setting-item { display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid rgba(255,255,255,0.04); flex-wrap:wrap; gap:8px; }
        .settings-group .setting-item .info { flex:1; min-width:120px; }
        .settings-group .setting-item .info .label { font-size:14px; font-weight:500; }
        .settings-group .setting-item .info .desc { font-size:12px; color:#8888a0; }
        .settings-group .setting-item input { flex:1; min-width:120px; padding:8px 12px; border-radius:10px; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.04); color:#f0ece4; font-size:13px; }
        .settings-group .setting-item .btn { width:auto; padding:8px 16px; flex-shrink:0; }
        .toast-container { position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:999; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; max-width:90%; }
        .toast { background:rgba(22,22,46,0.95); backdrop-filter:blur(16px); border:1px solid rgba(212,175,55,0.15); border-radius:16px; padding:14px 24px; color:#f0ece4; font-size:14px; font-weight:500; box-shadow:0 12px 40px rgba(0,0,0,0.6); animation:toastIn 0.4s cubic-bezier(0.34,1.56,0.64,1); pointer-events:auto; display:flex; align-items:center; gap:10px; }
        .toast.success { border-color:rgba(45,143,78,0.3); }
        .toast.error { border-color:rgba(180,40,40,0.3); }
        .toast i { font-size:18px; }
        .toast.success i { color:#4cdb7c; }
        .toast.error i { color:#f06a6a; }
        @keyframes toastIn { from { opacity:0; transform:translateY(-20px) scale(0.95); } to { opacity:1; transform:translateY(0) scale(1); } }
        @media (max-width:400px) { .menu-grid { gap:10px; } .menu-item { padding:12px 10px; } .cart-floating { padding:8px 14px 8px 18px; gap:10px; } .cart-floating .checkout-btn { padding:8px 16px; font-size:13px; } .modal-content { padding:20px 16px; } .admin-panel .stats { grid-template-columns:1fr 1fr; } }
        @media (min-width:600px) { .container { max-width:560px; } .menu-grid { grid-template-columns:1fr 1fr 1fr; } }
        .text-center { text-align:center; }
        .mt-8 { margin-top:8px; }
        .mt-16 { margin-top:16px; }
        .mt-24 { margin-top:24px; }
        .mb-8 { margin-bottom:8px; }
        .mb-16 { margin-bottom:16px; }
        .flex { display:flex; }
        .flex-center { display:flex; align-items:center; justify-content:center; }
        .hidden { display:none !important; }
        .w-full { width:100%; }
        .empty-state { text-align:center; padding:40px 20px; color:#8888a0; }
        .empty-state i { font-size:48px; color:#2a2a42; margin-bottom:12px; display:block; }
        .notification-hint { background:rgba(212,175,55,0.08); border-left:3px solid #d4af37; padding:12px 16px; border-radius:8px; margin-top:12px; font-size:13px; color:#c0c0d0; }
        .notification-hint i { color:#d4af37; margin-right:8px; }
    </style>
</head>
<body>

    <!-- ========== TOAST 容器 ========== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ========== 主容器 ========== -->
    <div class="container" id="app">

        <!-- ===== 顶部栏 ===== -->
        <div class="top-bar" id="topBar">
            <div class="brand">
                <i class="fas fa-leaf"></i>
                <span>茶韵</span>
            </div>
            <div class="actions">
                <button class="cart-btn" id="cartBtn" title="购物车">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="count" id="cartCount">0</span>
                </button>
                <button id="adminEntrance" title="管理后台">
                    <i class="fas fa-user-shield"></i>
                </button>
            </div>
        </div>

        <!-- ===== 页面：点单 ===== -->
        <div class="page active" id="pageMenu">
            <div class="category-tabs" id="categoryTabs"></div>
            <div class="menu-grid" id="menuGrid"></div>
            <div class="empty-state" id="emptyState" style="display:none;">
                <i class="fas fa-mug-saucer"></i>
                <div class="text">暂无商品</div>
            </div>
        </div>

        <!-- ===== 页面：结账 ===== -->
        <div class="page" id="pageCheckout">
            <div class="checkout-section">
                <div class="section-title">
                    <i class="fas fa-pen"></i> 填写订单信息
                </div>
                <div class="input-group">
                    <label><i class="fas fa-user"></i> 您的 Telegram ID / 昵称</label>
                    <input type="text" id="customerName" placeholder="例如 @xyu858699" value="" />
                </div>
                <label style="display:block;font-size:13px;font-weight:500;color:#a0a0b8;margin-bottom:6px;">
                    <i class="fas fa-utensils"></i> 用餐方式
                </label>
                <div class="dining-options" id="diningOptions">
                    <div class="option active" data-value="店内">
                        <i class="fas fa-store"></i> 店内 · 桌号
                    </div>
                    <div class="option" data-value="打包">
                        <i class="fas fa-box"></i> 打包 · 配送
                    </div>
                </div>
                <div class="input-group" id="diningDetailGroup">
                    <label id="diningDetailLabel">桌号</label>
                    <input type="text" id="diningDetail" placeholder="例如 A01" value="" />
                </div>
                <label style="display:block;font-size:13px;font-weight:500;color:#a0a0b8;margin-bottom:6px;margin-top:4px;">
                    <i class="fas fa-credit-card"></i> 付款方式
                </label>
                <div class="payment-options" id="paymentOptions">
                    <div class="option active" data-value="现金">
                        <i class="fas fa-money-bill-wave"></i> 现金付款
                    </div>
                    <div class="option" data-value="扫码">
                        <i class="fas fa-qrcode"></i> 扫码付款
                    </div>
                </div>
                <div id="uploadAreaWrapper" style="display:none;">
                    <div class="upload-area" id="uploadArea">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <div class="hint">点击上传付款截图</div>
                        <input type="file" accept="image/*" id="fileInput" style="display:none;" />
                        <button class="remove-img" id="removeImgBtn"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                <div class="order-summary" id="orderSummary">
                    <div id="summaryItems"></div>
                    <div class="total-row">
                        <span>总计</span>
                        <span class="price">¥<span id="summaryTotal">0.00</span></span>
                    </div>
                </div>
                <button class="btn btn-primary" id="submitOrderBtn">
                    <i class="fas fa-check-circle"></i> 提交订单
                </button>
                <button class="btn btn-secondary mt-8" id="backToMenuBtn">
                    <i class="fas fa-arrow-left"></i> 返回菜单
                </button>
            </div>
        </div>

        <!-- ===== 页面：订单完成 ===== -->
        <div class="page" id="pageSuccess">
            <div class="text-center" style="padding:40px 0;">
                <div style="font-size:72px;color:#4cdb7c;margin-bottom:16px;">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2 style="font-size:26px;font-weight:700;margin-bottom:8px;">订单已提交</h2>
                <p style="color:#8888a0;font-size:15px;" id="successMessage">等待店主确认</p>
                <div style="margin-top:24px;background:rgba(255,255,255,0.04);border-radius:16px;padding:16px;text-align:left;">
                    <p style="font-size:13px;color:#8888a0;">订单号：<span id="successOrderId" style="color:#d4af37;font-weight:600;"></span></p>
                    <p style="font-size:13px;color:#8888a0;margin-top:4px;">状态：<span id="successStatus" style="color:#d4af37;font-weight:600;">待确认</span></p>
                </div>
                <!-- 通知状态提示 -->
                <div id="notificationHint" class="notification-hint" style="display:none;">
                    <i class="fas fa-info-circle"></i>
                    <span id="notificationHintText">通知发送失败，请检查后台 Telegram 配置（Bot Token 和店主 ID）。</span>
                </div>
                <button class="btn btn-primary mt-24" id="continueShoppingBtn">
                    <i class="fas fa-arrow-left"></i> 继续点单
                </button>
            </div>
        </div>

        <!-- ===== 页面：后台登录 ===== -->
        <div class="page" id="pageAdminLogin">

    <script>
        // ================================================================
        //  DATA
        // ================================================================
        const DEFAULT_MENU = [{
            id: 1,
            category: '经典奶茶',
            name: '珍珠奶茶',
            desc: 'Q弹珍珠 · 经典风味',
            price: 15,
            icon: '🧋'
        }, {
            id: 2,
            category: '经典奶茶',
            name: '椰香奶茶',
            desc: '浓郁椰香 · 丝滑口感',
            price: 17,
            icon: '🥥'
        }, {
            id: 3,
            category: '经典奶茶',
            name: '焦糖奶茶',
            desc: '焦糖香甜 · 暖心之选',
            price: 16,
            icon: '🍬'
        }, {
            id: 4,
            category: '鲜果茶',
            name: '满杯红柚',
            desc: '鲜红柚汁 · 清爽解腻',
            price: 20,
            icon: '🍊'
        }, {
            id: 5,
            category: '鲜果茶',
            name: '金桔柠檬',
            desc: '金桔+柠檬 · 酸甜醒神',
            price: 18,
            icon: '🍋'
        }, {
            id: 6,
            category: '鲜果茶',
            name: '百香果茶',
            desc: '百香果粒 · 热带风情',
            price: 19,
            icon: '🍈'
        }, {
            id: 7,
            category: '芝士茶',
            name: '芝士奶盖绿',
            desc: '海盐奶盖 · 茉莉茶底',
            price: 22,
            icon: '🧀'
        }, {
            id: 8,
            category: '芝士茶',
            name: '芝士草莓',
            desc: '鲜草莓+芝士奶盖',
            price: 24,
            icon: '🍓'
        }, {
            id: 9,
            category: '芝士茶',
            name: '芝士黑提',
            desc: '黑提果肉 · 芝香浓郁',
            price: 23,
            icon: '🍇'
        }];

        // ================================================================
        //  STATE
        // ================================================================
        let state = {
            menu: [],
            categories: [],
            cart: [],
            orders: [],
            settings: {
                telegramId: '@店主_茶韵',
                botToken: '',
                adminPassword: '123456'
            },
            currentCategory: '',
            customerName: '',
            diningType: '店内',
            diningDetail: '',
            paymentMethod: '现金',
            paymentImage: null,
            isAdminLoggedIn: false,
            selectedOrderId: null,
        };

        // ================================================================
        //  DOM REFS
        // ================================================================
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);

        const dom = {
            pageMenu: $('#pageMenu'),
            pageCheckout: $('#pageCheckout'),
            pageSuccess: $('#pageSuccess'),
            pageAdminLogin: $('#pageAdminLogin'),
            pageAdminPanel: $('#pageAdminPanel'),

            categoryTabs: $('#categoryTabs'),
            menuGrid: $('#menuGrid'),
            emptyState: $('#emptyState'),

            cartFloating: $('#cartFloating'),
            cartFloatingCount: $('#cartFloatingCount'),
            cartFloatingTotal: $('#cartFloatingTotal'),
            cartCount: $('#cartCount'),
            cartBtn: $('#cartBtn'),
            cartCheckoutBtn: $('#cartCheckoutBtn'),

            customerName: $('#customerName'),
            diningOptions: $$('#diningOptions .option'),
            diningDetail: $('#diningDetail'),
            diningDetailLabel: $('#diningDetailLabel'),
            diningDetailGroup: $('#diningDetailGroup'),
            paymentOptions: $$('#paymentOptions .option'),
            uploadAreaWrapper: $('#uploadAreaWrapper'),
            uploadArea: $('#uploadArea'),
            fileInput: $('#fileInput'),
            removeImgBtn: $('#removeImgBtn'),

            summaryItems: $('#summaryItems'),
            summaryTotal: $('#summaryTotal'),
            submitOrderBtn: $('#submitOrderBtn'),
            backToMenuBtn: $('#backToMenuBtn'),

            successOrderId: $('#successOrderId'),
            successStatus: $('#successStatus'),
            successMessage: $('#successMessage'),
            notificationHint: $('#notificationHint'),
            notificationHintText: $('#notificationHintText'),
            continueShoppingBtn: $('#continueShoppingBtn'),

            adminEntrance: $('#adminEntrance'),
            adminPasswordInput: $('#adminPasswordInput'),
            adminLoginBtn: $('#adminLoginBtn'),
            adminLoginBackBtn: $('#adminLoginBackBtn'),
            adminLogoutBtn: $('#adminLogoutBtn'),
            adminSettingsBtn: $('#adminSettingsBtn'),
            adminSettingsPanel: $('#adminSettingsPanel'),
            closeSettingsBtn: $('#closeSettingsBtn'),
            adminTelegramIdInput: $('#adminTelegramIdInput'),
            adminBotTokenInput: $('#adminBotTokenInput'),
            saveTelegramIdBtn: $('#saveTelegramIdBtn'),
            saveBotTokenBtn: $('#saveBotTokenBtn'),
            testNotificationBtn: $('#testNotificationBtn'),
            adminNewPasswordInput: $('#adminNewPasswordInput'),
            savePasswordBtn: $('#savePasswordBtn'),
            adminOrderList: $('#adminOrderList'),
            statTotal: $('#statTotal'),
            statPending: $('#statPending'),
            statConfirmed: $('#statConfirmed'),
            orderCountLabel: $('#orderCountLabel'),

            modal: $('#orderModal'),
            modalBody: $('#modalBody'),
            modalCloseBtn: $('#modalCloseBtn'),

            toastContainer: $('#toastContainer'),
        };

        // ================================================================
        //  HELPERS
        // ================================================================
        function genId() {
            const d = new Date();
            const ts = d.getFullYear() +
                String(d.getMonth() + 1).padStart(2, '0') +
                String(d.getDate()).padStart(2, '0') + '-' +
                String(d.getHours()).padStart(2, '0') +
                String(d.getMinutes()).padStart(2, '0') +
                String(d.getSeconds()).padStart(2, '0');
            const rand = String(Math.floor(Math.random() * 1000)).padStart(3, '0');
            return 'CH' + ts + rand;
        }

        function formatPrice(v) { return v.toFixed(2); }

        function getCartTotal() {
            return state.cart.reduce((s, i) => s + i.price * i.quantity, 0);
        }

        function getCartCount() {
            return state.cart.reduce((s, i) => s + i.quantity, 0);
        }

        function saveState() {
            try {
                localStorage.setItem('teaShop_state', JSON.stringify({
                    menu: state.menu,
                    orders: state.orders,
                    settings: state.settings,
                }));
            } catch (e) {}
        }

        function loadState() {
            try {
                const raw = localStorage.getItem('teaShop_state');
                if (raw) {
                    const data = JSON.parse(raw);
                    state.menu = data.menu || [];
                    state.orders = data.orders || [];
                    state.settings = data.settings || state.settings;
                }
            } catch (e) {}
            if (!state.menu.length) {
                state.menu = JSON.parse(JSON.stringify(DEFAULT_MENU));
            }
            const cats = new Set();
            state.menu.forEach(item => cats.add(item.category));
            state.categories = Array.from(cats);
            if (state.categories.length) state.currentCategory = state.categories[0];
        }

        function showToast(text, type = 'info', duration = 3000) {
            const icons = {
                info: 'fa-info-circle',
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
            };
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${text}`;
            dom.toastContainer.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-10px)';
                setTimeout(() => el.remove(), 300);
            }, duration);
        }

        // ================================================================
        //  TELEGRAM NOTIFICATION (真实API)
        // ================================================================
        async function sendTelegramMessage(text) {
            const token = state.settings.botToken?.trim();
            const chatId = state.settings.telegramId?.trim();
            if (!token || !chatId) {
                console.log('[模拟通知]', text);
                return { ok: false, error: 'Token 或 ID 未配置' };
            }
            try {
                const url = `https://api.telegram.org/bot${token}/sendMessage`;
                const resp = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: text,
                        parse_mode: 'HTML',
                    })
                });
                const data = await resp.json();
                if (data.ok) {
                    console.log('[Telegram] 发送成功', data);
                    return { ok: true, data };
                } else {
                    console.error('[Telegram] 发送失败', data);
                    return { ok: false, error: data.description || '未知错误' };
                }
            } catch (e) {
                console.error('[Telegram] 网络错误', e);
                return { ok: false, error: e.message };
            }
        }

        // ================================================================
        //  RENDER: MENU
        // ================================================================
        function renderCategories() {
            const container = dom.categoryTabs;
            container.innerHTML = '';
            state.categories.forEach((cat, idx) => {
                const tab = document.createElement('div');
                tab.className = `tab${idx === 0 ? ' active' : ''}`;
                tab.textContent = cat;
                tab.dataset.cat = cat;
                tab.addEventListener('click', () => {
                    state.currentCategory = cat;
                    renderCategories();
                    renderMenu();
                });
                container.appendChild(tab);
            });
            const tabs = container.querySelectorAll('.tab');
            tabs.forEach(t => {
                t.classList.toggle('active', t.dataset.cat === state.currentCategory);
            });
        }

        function renderMenu() {
            const grid = dom.menuGrid;
            const empty = dom.emptyState;
            const items = state.menu.filter(i => i.category === state.currentCategory);
            if (!items.length) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            grid.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'menu-item';
                const inCart = state.cart.find(c => c.id === item.id);
                const qty = inCart ? inCart.quantity : 0;
                card.innerHTML = `
              <span class="icon">${item.icon || '🧋'}</span>
              <div class="name">${item.name}</div>
              <div class="desc">${item.desc || ''}</div>
              <div class="bottom">
                <span class="price">¥${formatPrice(item.price)}</span>
                <button class="add-btn" data-id="${item.id}">
                  <i class="fas fa-plus"></i>
                </button>
              </div>
              ${qty > 0 ? `<div style="position:absolute;top:8px;right:12px;background:rgba(212,175,55,0.2);color:#d4af37;font-size:12px;font-weight:700;padding:2px 10px;border-radius:50px;">×${qty}</div>` : ''}
            `;
                card.querySelector('.add-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    addToCart(item.id);
                });
                grid.appendChild(card);
            });
        }

        // ================================================================
        //  CART
        // ================================================================
        function addToCart(itemId) {
            const item = state.menu.find(i => i.id === itemId);
            if (!item) return;
            const existing = state.cart.find(c => c.id === itemId);
            if (existing) {
                existing.quantity += 1;
            } else {
                state.cart.push({ id: item.id, name: item.name, price: item.price, quantity: 1 });
            }
            updateCartUI();
            showToast(`已添加 ${item.name}`, 'success', 1500);
        }

        function updateCartUI() {
            const count = getCartCount();
            const total = getCartTotal();
            dom.cartCount.textContent = count;
            dom.cartFloatingCount.textContent = count;
            dom.cartFloatingTotal.textContent = formatPrice(total);
            dom.cartFloating.classList.toggle('hidden', count === 0);
            renderMenu();
            if (dom.pageCheckout.classList.contains('active')) {
                renderSummary();
            }
        }

        // ================================================================
        //  RENDER: CHECKOUT SUMMARY
        // ================================================================
        function renderSummary() {
            const container = dom.summaryItems;
            container.innerHTML = '';
            if (!state.cart.length) {
                container.innerHTML = '<div style="color:#8888a0;text-align:center;padding:12px 0;">购物车为空</div>';
                dom.summaryTotal.textContent = '0.00';
                return;
            }
            state.cart.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
              <span>${item.name} × ${item.quantity}</span>
              <span>¥${formatPrice(item.price * item.quantity)}</span>
            `;
                container.appendChild(row);
            });
            dom.summaryTotal.textContent = formatPrice(getCartTotal());
        }

        // ================================================================
        //  NAVIGATION
        // ================================================================
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const page = document.getElementById(pageId);
            if (page) page.classList.add('active');
            if (pageId === 'pageMenu') {
                updateCartUI();
            } else {
                dom.cartFloating.classList.add('hidden');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ================================================================
        //  CHECKOUT FLOW
        // ================================================================
        function openCheckout() {
            if (!state.cart.length) {
                showToast('请先添加商品', 'error');
                return;
            }
            dom.customerName.value = state.customerName || '';
            const diningOpts = dom.diningOptions;
            diningOpts.forEach(opt => {
                opt.classList.toggle('active', opt.dataset.value === state.diningType);
            });
            dom.diningDetail.value = state.diningDetail || '';
            updateDiningLabel();

            const payOpts = dom.paymentOptions;
            payOpts.forEach(opt => {
                opt.classList.toggle('active', opt.dataset.value === state.paymentMethod);
            });
            toggleUploadArea(state.paymentMethod === '扫码');

            renderSummary();
            showPage('pageCheckout');
        }

        function updateDiningLabel() {
            const is店内 = state.diningType === '店内';
            dom.diningDetailLabel.textContent = is店内 ? '桌号' : '配送地址';
            dom.diningDetail.placeholder = is店内 ? '例如 A01' : '请输入详细地址';
        }

        function toggleUploadArea(show) {
            dom.uploadAreaWrapper.style.display = show ? 'block' : 'none';
        }

        // ================================================================
        //  SUBMIT ORDER
        // ================================================================
        async function submitOrder() {
            const name = dom.customerName.value.trim();
            if (!name) {
                showToast('请填写您的 Telegram ID / 昵称', 'error');
                return;
            }
            state.customerName = name;

            const diningType = state.diningType;
            const diningDetail = dom.diningDetail.value.trim();
            if (!diningDetail) {
                showToast(diningType === '店内' ? '请填写桌号' : '请填写配送地址', 'error');
                return;
            }
            state.diningDetail = diningDetail;

            const paymentMethod = state.paymentMethod;
            if (paymentMethod === '扫码') {
                if (!state.paymentImage) {
                    showToast('请上传付款截图', 'error');
                    return;
                }
            }

            if (!state.cart.length) {
                showToast('购物车为空', 'error');
                return;
            }

            const order = {
                id: genId(),
                customerName: name,
                items: JSON.parse(JSON.stringify(state.cart)),
                total: getCartTotal(),
                diningType: diningType,
                diningDetail: diningDetail,
                paymentMethod: paymentMethod,
                paymentImage: state.paymentImage || null,
                status: paymentMethod === '现金' ? '已确认' : '待确认',
                createdAt: new Date().toLocaleString('zh-CN', { hour12: false }),
                rawTimestamp: Date.now(),
            };

            state.orders.unshift(order);
            saveState();

            // 清空购物车 & 图片
            state.cart = [];
            updateCartUI();
            state.paymentImage = null;
            dom.fileInput.value = '';
            dom.uploadArea.classList.remove('has-img');
            dom.uploadArea.querySelector('img')?.remove();

            // 显示成功页
            dom.successOrderId.textContent = order.id;
            dom.successStatus.textContent = order.status;
            dom.successMessage.textContent = paymentMethod === '现金' ?
                '✅ 现金付款已确认，请等待制作完成。' :
                '⏳ 扫码付款等待店主确认，请留意通知。';
            // 隐藏提示
            dom.notificationHint.style.display = 'none';
            showPage('pageSuccess');

            // ----- 发送 Telegram 通知（店主） -----
            const itemsText = order.items.map(i => `${i.name} × ${i.quantity}`).join('、');
            const statusEmoji = order.status === '已确认' ? '✅' : '⏳';
            const msg = `
🧋 <b>新订单 #${order.id}</b>
👤 客户：${order.customerName}
📦 商品：${itemsText}
💰 总计：¥${formatPrice(order.total)}
🍽️ 方式：${order.diningType} · ${order.diningDetail}
💳 付款：${order.paymentMethod}
📌 状态：${order.status}
${order.paymentMethod === '扫码' ? '📎 附付款截图（请在后台查看）' : ''}
            `.trim();

            const result = await sendTelegramMessage(msg);
            if (!result.ok) {
                // 发送失败，显示提示
                dom.notificationHint.style.display = 'block';
                dom.notificationHintText.textContent = `⚠️ 通知发送失败：${result.error || '未知错误'}。请检查后台 Bot Token 和店主 ID 配置，并确保店主已与 Bot 对话。`;
            } else {
                // 如果是现金付款，再发一条确认通知（可选）
                if (order.status === '已确认') {
                    await sendTelegramMessage(`✅ 订单 ${order.id} 已自动确认（现金付款）`);
                }
            }
        }

        // ================================================================
        //  ADMIN
        // ================================================================
        function adminLogin() {
            const pwd = dom.adminPasswordInput.value.trim();
            if (pwd === state.settings.adminPassword) {
                state.isAdminLoggedIn = true;
                dom.adminPasswordInput.value = '';
                renderAdminPanel();
                showPage('pageAdminPanel');
                showToast('登录成功', 'success');
            } else {
                showToast('密码错误', 'error');
            }
        }

        function renderAdminPanel() {
            const orders = state.orders;
            const total = orders.length;
            const pending = orders.filter(o => o.status === '待确认').length;
            const confirmed = orders.filter(o => o.status === '已确认').length;

            dom.statTotal.textContent = total;
            dom.statPending.textContent = pending;
            dom.statConfirmed.textContent = confirmed;
            dom.orderCountLabel.textContent = `${total} 笔`;

            const list = dom.adminOrderList;
            if (!orders.length) {
                list.innerHTML = `
              <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <div class="text">暂无订单</div>
              </div>
            `;
                return;
            }

            list.innerHTML = '';
            orders.forEach((order) => {
                const card = document.createElement('div');
                card.className = 'order-card';
                const statusMap = {
                    '待确认': '<span class="badge badge-orange">待确认</span>',
                    '已确认': '<span class="badge badge-green">已确认</span>',
                };
                const itemsStr = order.items.map(i => `${i.name}×${i.quantity}`).join('、');
                const payIcon = order.paymentMethod === '现金' ? '💵' : '📱';
                card.innerHTML = `
              <div class="top-row">
                <div class="customer">
                  ${order.customerName}
                  <small>${payIcon} ${order.paymentMethod}</small>
                </div>
                <div class="status">${statusMap[order.status] || order.status}</div>
              </div>
              <div class="items-preview">${itemsStr}</div>
              <div class="bottom-row">
                <span>${order.diningType} · ${order.diningDetail}</span>
                <span class="total">¥${formatPrice(order.total)}</span>
              </div>
              <div style="font-size:12px;color:#6a6a82;margin-top:4px;">${order.createdAt}</div>
            `;
                card.addEventListener('click', () => openOrderDetail(order.id));
                list.appendChild(card);
            });
        }

        function openOrderDetail(orderId) {
            const order = state.orders.find(o => o.id === orderId);
            if (!order) return;
            state.selectedOrderId = orderId;

            const body = dom.modalBody;
            const statusMap = {
                '待确认': '<span class="badge badge-orange">待确认</span>',
                '已确认': '<span class="badge badge-green">已确认</span>',
            };
            const itemsHtml = order.items.map(i =>
                `<div class="detail-row"><span class="label">${i.name} × ${i.quantity}</span><span class="value">¥${formatPrice(i.price * i.quantity)}</span></div>`
            ).join('');

            let paymentImageHtml = '';
            if (order.paymentImage) {
                paymentImageHtml = `
              <div class="payment-image">
                <img src="${order.paymentImage}" alt="付款截图" />
              </div>
            `;
            }

            const isPending = order.status === '待确认';

            body.innerHTML = `
            <div class="detail-row"><span class="label">订单号</span><span class="value" style="color:#d4af37;font-weight:600;">${order.id}</span></div>
            <div class="detail-row"><span class="label">客户</span><span class="value">${order.customerName}</span></div>
            <div class="detail-row"><span class="label">用餐方式</span><span class="value">${order.diningType} · ${order.diningDetail}</span></div>
            <div class="detail-row"><span class="label">付款方式</span><span class="value">${order.paymentMethod}</span></div>
            <div class="detail-row"><span class="label">状态</span><span class="value">${statusMap[order.status] || order.status}</span></div>
            <div class="detail-row"><span class="label">时间</span><span class="value">${order.createdAt}</span></div>
            <div style="margin:10px 0 4px;font-weight:600;color:#d4af37;">商品明细</div>
            ${itemsHtml}
            <div class="detail-row" style="border-top:2px solid rgba(212,175,55,0.15);margin-top:6px;padding-top:12px;font-weight:700;">
              <span class="label">总计</span>
              <span class="value" style="color:#d4af37;font-size:18px;">¥${formatPrice(order.total)}</span>
            </div>
            ${paymentImageHtml}
            <div class="modal-actions">
              ${isPending ? `<button class="btn btn-success btn-sm" id="modalConfirmBtn"><i class="fas fa-check"></i> 确认订单</button>` : ''}
              ${isPending ? `<button class="btn btn-danger btn-sm" id="modalCancelBtn"><i class="fas fa-times"></i> 取消订单</button>` : ''}
              <button class="btn btn-secondary btn-sm" id="modalCloseBtn2">关闭</button>
            </div>
          `;

            dom.modal.classList.add('show');

            const closeModal = () => dom.modal.classList.remove('show');
            dom.modal.querySelector('#modalCloseBtn2')?.addEventListener('click', closeModal);

            if (isPending) {
                dom.modal.querySelector('#modalConfirmBtn')?.addEventListener('click', () => {
                    confirmOrder(order.id);
                    closeModal();
                });
                dom.modal.querySelector('#modalCancelBtn')?.addEventListener('click', () => {
                    cancelOrder(order.id);
                    closeModal();
                });
            }
        }

        async function confirmOrder(orderId) {
            const order = state.orders.find(o => o.id === orderId);
            if (!order) return;
            if (order.status === '已确认') {
                showToast('订单已确认', 'info');
                return;
            }
            order.status = '已确认';
            saveState();
            renderAdminPanel();
            showToast(`✅ 订单 ${orderId} 已确认`, 'success');

            const itemsText = order.items.map(i => `${i.name} × ${i.quantity}`).join('、');
            const msg = `
✅ <b>订单已确认 #${order.id}</b>
👤 客户：${order.customerName}
📦 商品：${itemsText}
💰 总计：¥${formatPrice(order.total)}
🍽️ 方式：${order.diningType} · ${order.diningDetail}
💳 付款：${order.paymentMethod}
⏰ 确认时间：${new Date().toLocaleString('zh-CN', { hour12: false })}
            `.trim();
            const result = await sendTelegramMessage(msg);
            if (!result.ok) {
                showToast('⚠️ 确认通知发送失败，请检查配置', 'error', 3000);
            }
        }

        function cancelOrder(orderId) {
            const idx = state.orders.findIndex(o => o.id === orderId);
            if (idx === -1) return;
            state.orders.splice(idx, 1);
            saveState();
            renderAdminPanel();
            showToast(`已取消订单 ${orderId}`, 'error');
            sendTelegramMessage(`❌ 订单 ${orderId} 已取消`);
        }

        // ================================================================
        //  SETTINGS
        // ================================================================
        function openSettings() {
            dom.adminTelegramIdInput.value = state.settings.telegramId || '';
            dom.adminBotTokenInput.value = state.settings.botToken || '';
            dom.adminNewPasswordInput.value = '';
            dom.adminSettingsPanel.style.display = 'block';
        }

        function saveTelegramId() {
            const val = dom.adminTelegramIdInput.value.trim();
            if (!val) {
                showToast('请输入有效的 Telegram ID（建议数字ID）', 'error');
                return;
            }
            state.settings.telegramId = val;
            saveState();
            showToast('✅ Telegram ID 已更新', 'success');
        }

        function saveBotToken() {
            const val = dom.adminBotTokenInput.value.trim();
            if (!val) {
                showToast('请输入 Bot Token', 'error');
                return;
            }
            state.settings.botToken = val;
            saveState();
            showToast('✅ Bot Token 已更新', 'success');
        }

        async function testNotification() {
            const token = state.settings.botToken?.trim();
            const chatId = state.settings.telegramId?.trim();
            if (!token || !chatId) {
                showToast('请先设置 Bot Token 和 Telegram ID', 'error');
                return;
            }
            const msg = '🧪 这是一条来自【茶韵】的测试通知。配置正确！';
            showToast('⏳ 正在发送测试通知...', 'info', 2000);
            const result = await sendTelegramMessage(msg);
            if (result.ok) {
                showToast('✅ 测试通知发送成功！', 'success');
            } else {
                showToast(`❌ 测试失败：${result.error}。请检查 Token 和 ID，并确保店主已与 Bot 对话。`, 'error', 5000);
            }
        }

        function savePassword() {
            const val = dom.adminNewPasswordInput.value.trim();
            if (val.length < 6) {
                showToast('密码至少6位', 'error');
                return;
            }
            state.settings.adminPassword = val;
            saveState();
            dom.adminNewPasswordInput.value = '';
            showToast('✅ 密码已更新', 'success');
        }

        // ================================================================
        //  EVENTS
        // ================================================================
        function init() {
            loadState();
            renderCategories();
            renderMenu();
            updateCartUI();

            dom.cartBtn.addEventListener('click', openCheckout);
            dom.cartCheckoutBtn.addEventListener('click', openCheckout);

            dom.backToMenuBtn.addEventListener('click', () => {
                showPage('pageMenu');
                updateCartUI();
            });

            dom.continueShoppingBtn.addEventListener('click', () => {
                showPage('pageMenu');
                updateCartUI();
            });

            dom.diningOptions.forEach(opt => {
                opt.addEventListener('click', () => {
                    dom.diningOptions.forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                    state.diningType = opt.dataset.value;
                    updateDiningLabel();
                });
            });

            dom.paymentOptions.forEach(opt => {
                opt.addEventListener('click', () => {
                    dom.paymentOptions.forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                    state.paymentMethod = opt.dataset.value;
                    toggleUploadArea(state.paymentMethod === '扫码');
                    if (state.paymentMethod === '现金') {
                        state.paymentImage = null;
                        dom.fileInput.value = '';
                        dom.uploadArea.classList.remove('has-img');
                        dom.uploadArea.querySelector('img')?.remove();
                    }
                });
            });

            dom.uploadArea.addEventListener('click', () => {
                dom.fileInput.click();
            });
            dom.fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const base64 = ev.target.result;
                    state.paymentImage = base64;
                    dom.uploadArea.classList.add('has-img');
                    dom.uploadArea.querySelector('img')?.remove();
                    const img = document.createElement('img');
                    img.src = base64;
                    dom.uploadArea.appendChild(img);
                    showToast('✅ 截图已上传', 'success');
                };
                reader.readAsDataURL(file);
            });
            dom.removeImgBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                state.paymentImage = null;
                dom.fileInput.value = '';
                dom.uploadArea.classList.remove('has-img');
                dom.uploadArea.querySelector('img')?.remove();
            });

            dom.submitOrderBtn.addEventListener('click', submitOrder);

            dom.adminEntrance.addEventListener('click', () => {
                if (state.isAdminLoggedIn) {
                    renderAdminPanel();
                    showPage('pageAdminPanel');
                } else {
                    dom.adminPasswordInput.value = '';
                    showPage('pageAdminLogin');
                }
            });

            dom.adminLoginBtn.addEventListener('click', adminLogin);
            dom.adminPasswordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') adminLogin();
            });
            dom.adminLoginBackBtn.addEventListener('click', () => {
                showPage('pageMenu');
                updateCartUI();
            });

            dom.adminLogoutBtn.addEventListener('click', () => {
                state.isAdminLoggedIn = false;
                showPage('pageMenu');
                updateCartUI();
                showToast('已退出后台', 'info');
            });

            dom.adminSettingsBtn.addEventListener('click', () => {
                if (dom.adminSettingsPanel.style.display === 'block') {
                    dom.adminSettingsPanel.style.display = 'none';
                } else {
                    openSettings();
                }
            });
            dom.closeSettingsBtn.addEventListener('click', () => {
                dom.adminSettingsPanel.style.display = 'none';
            });
            dom.saveTelegramIdBtn.addEventListener('click', saveTelegramId);
            dom.saveBotTokenBtn.addEventListener('click', saveBotToken);
            dom.testNotificationBtn.addEventListener('click', testNotification);
            dom.savePasswordBtn.addEventListener('click', savePassword);

            dom.modalCloseBtn.addEventListener('click', () => {
                dom.modal.classList.remove('show');
            });
            dom.modal.addEventListener('click', (e) => {
                if (e.target === dom.modal) dom.modal.classList.remove('show');
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') dom.modal.classList.remove('show');
            });

            console.log('🍵 茶韵点单系统已启动 (支持Telegram真实通知 + 测试)');
            console.log(`📦 ${state.orders.length} 笔历史订单`);
            console.log(`👤 店主 ID: ${state.settings.telegramId}`);
            if (state.settings.botToken) {
                console.log('🤖 Bot Token 已配置');
            } else {
                console.log('⚠️ Bot Token 未配置，通知将模拟发送');
            }
        }

        // 暴露调试
        window.__teaShop = {
            state,
            addToCart,
            confirmOrder,
            cancelOrder,
            sendTelegramMessage,
            testNotification,
            saveState,
            renderAdminPanel,
        };

        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
