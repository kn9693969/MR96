<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星云奶茶店 Milky Way Boba - 智能点餐系统</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX compilation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(241, 245, 249, 0.8);
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-amber-100 selection:text-amber-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Default Mock Menu Items
        const DEFAULT_MENU = [
            {
                id: '1',
                name: '黑糖珍珠鲜奶',
                enName: 'Brown Sugar Boba Fresh Milk',
                category: 'classic',
                price: 22,
                image: 'https://images.unsplash.com/photo-1558857563-b371033873b8?auto=format&fit=crop&q=80&w=600',
                desc: '浓郁手炒黑糖包裹Q弹珍珠，融合纯正高清浓醇鲜牛奶。',
                popular: true
            },
            {
                id: '2',
                name: '多肉葡萄芝士',
                enName: 'Cheesy Fresh Grape Slush',
                category: 'fruit',
                price: 26,
                image: 'https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?auto=format&fit=crop&q=80&w=600',
                desc: '严选优质巨峰葡萄，手工剥皮去籽，搭配清爽绿茶底与咸香奶盖。',
                popular: true
            },
            {
                id: '3',
                name: '杨枝甘露',
                enName: 'Mango Pomelo Sago',
                category: 'fruit',
                price: 25,
                image: 'https://images.unsplash.com/photo-1546833999-b9f581a1996d?auto=format&fit=crop&q=80&w=600',
                desc: '香甜芒果搭配西柚肉与西米露，加入椰浆，口感多层次爆棚。',
                popular: false
            },
            {
                id: '4',
                name: '茉莉飘香原叶乌龙',
                enName: 'Jasmine Oolong Pure Tea',
                category: 'pure',
                price: 16,
                image: 'https://images.unsplash.com/photo-1576092768241-dec231879fc3?auto=format&fit=crop&q=80&w=600',
                desc: '高山优质茶芽，传统烘焙工艺，回甘悠长，清香袭人。',
                popular: false
            },
            {
                id: '5',
                name: '芋泥波波奶茶',
                enName: 'Taro Paste Milk Tea',
                category: 'classic',
                price: 24,
                image: 'https://images.unsplash.com/photo-1572490122747-3968b75cc699?auto=format&fit=crop&q=80&w=600',
                desc: '细腻手打芋泥，搭配香醇奶茶与Q弹芋圆，暖心饱腹首选。',
                popular: true
            },
            {
                id: '6',
                name: '生椰拿铁波波',
                enName: 'Raw Coconut Coffee Boba',
                category: 'special',
                price: 28,
                image: 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?auto=format&fit=crop&q=80&w=600',
                desc: '清甜生椰乳碰撞浓缩咖啡与黑糖珍珠，跨界高颜值新美味。',
                popular: false
            }
        ];

        // Customization Options
        const SWEETNESS_OPTIONS = ['100% 正常糖', '75% 少糖', '50% 半糖', '30% 微糖', '0% 无糖'];
        const ICE_OPTIONS = ['正常冰', '少冰', '去冰', '温热'];
        const TOPPING_OPTIONS = [
            { name: '黑糖珍珠', price: 3 },
            { name: '椰果', price: 3 },
            { name: '咸香奶盖', price: 5 },
            { name: '手打芋泥', price: 5 },
            { name: '脆波波', price: 4 }
        ];

        function App() {
            // View state: 'customer' | 'admin'
            const [viewMode, setViewMode] = useState('customer');

            // Store Settings
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('boba_settings');
                return saved ? JSON.parse(saved) : {
                    shopName: '星云奶茶店 Milky Way Boba',
                    botToken: '',
                    chatId: '',
                    qrCodeUrl: 'https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=MILKYWAY_BOBA_PAYMENT_ACCOUNT'
                };
            });

            // Active category filter
            const [selectedCategory, setSelectedCategory] = useState('all');
            
            // Menu Items State
            const [menuItems, setMenuItems] = useState(DEFAULT_MENU);

            // Cart State
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);

            // Customization Modal State
            const [selectedItem, setSelectedItem] = useState(null);
            const [customOptions, setCustomOptions] = useState({
                size: '大杯',
                sweetness: '50% 半糖',
                ice: '少冰',
                selectedToppings: []
            });

            // Checkout State
            const [telegramHandle, setTelegramHandle] = useState('');
            const [paymentMethod, setPaymentMethod] = useState('qr'); // 'cash' or 'qr'
            const [billSlip, setBillSlip] = useState(null); // Base64 or Blob URL
            const [isSubmitting, setIsSubmitting] = useState(false);

            // Orders State (Stored in localStorage for simulation)
            const [orders, setOrders] = useState(() => {
                const saved = localStorage.getItem('boba_orders');
                return saved ? JSON.parse(saved) : [];
            });

            // Notification / Toast State
            const [toast, setToast] = useState(null);

            // AI Recommendation Modal State
            const [isAiModalOpen, setIsAiModalOpen] = useState(false);
            const [aiPrompt, setAiPrompt] = useState('');
            const [aiLoading, setAiLoading] = useState(false);
            const [aiResult, setAiResult] = useState(null);

            // Active Order Confirmation Modal
            const [activeOrderConfirmation, setActiveOrderConfirmation] = useState(null);

            // Save Settings
            useEffect(() => {
                localStorage.setItem('boba_settings', JSON.stringify(settings));
            }, [settings]);

            // Save Orders
            useEffect(() => {
                localStorage.setItem('boba_orders', JSON.stringify(orders));
            }, [orders]);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const handleOpenCustomize = (item) => {
                setSelectedItem(item);
                setCustomOptions({
                    size: '大杯',
                    sweetness: '50% 半糖',
                    ice: '少冰',
                    selectedToppings: []
                });
            };

            const toggleTopping = (topping) => {
                setCustomOptions(prev => {
                    const exists = prev.selectedToppings.some(t => t.name === topping.name);
                    if (exists) {
                        return { ...prev, selectedToppings: prev.selectedToppings.filter(t => t.name !== topping.name) };
                    } else {
                        return { ...prev, selectedToppings: [...prev.selectedToppings, topping] };
                    }
                });
            };

            const handleAddToCart = () => {
                if (!selectedItem) return;
                
                const toppingCost = customOptions.selectedToppings.reduce((sum, t) => sum + t.price, 0);
                const sizeExtra = customOptions.size === '超大杯' ? 4 : 0;
                const unitPrice = selectedItem.price + toppingCost + sizeExtra;

                const cartItem = {
                    cartId: Date.now() + Math.random().toString(),
                    id: selectedItem.id,
                    name: selectedItem.name,
                    price: unitPrice,
                    size: customOptions.size,
                    sweetness: customOptions.sweetness,
                    ice: customOptions.ice,
                    toppings: customOptions.selectedToppings.map(t => t.name),
                    quantity: 1
                };

                setCart(prev => [...prev, cartItem]);
                setSelectedItem(null);
                showToast(`已加入购物车: ${selectedItem.name}`, 'success');
            };

            const updateCartQuantity = (cartId, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.cartId === cartId) {
                        const newQty = item.quantity + delta;
                        return newQty > 0 ? { ...item, quantity: newQty } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const cartTotal = useMemo(() => {
                return cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            }, [cart]);

            const handleBillSlipUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (file.size > 5 * 1024 * 1024) {
                    showToast('图片文件不能超过 5MB', 'error');
                    return;
                }

                const reader = new FileReader();
                reader.onloadend = () => {
                    setBillSlip(reader.result);
                    showToast('结账单凭证上传成功！', 'success');
                };
                reader.readAsDataURL(file);
            };

            const sendTelegramNotification = async (order) => {
                if (!settings.botToken || !settings.chatId) {
                    console.log('Telegram Bot Token or Chat ID not configured. Skipping live Telegram dispatch.');
                    return;
                }

                const itemsText = order.items.map(i => 
                    `• *${i.name}* x${i.quantity} (${i.size}, ${i.sweetness}, ${i.ice}${i.toppings.length ? ', 加料:' + i.toppings.join('+') : ''}) - ¥${i.price * i.quantity}`
                ).join('\n');

                const message = 
`🚨 *【新订单通知】* 
────────────────
🆔 *订单号*: \`#${order.id}\`
👤 *Telegram*: ${order.telegramHandle}
💵 *支付方式*: ${order.paymentMethod === 'qr' ? '扫码付款 (待审核 ⏳)' : '现金支付 (现场收取 💵)'}
💰 *总金额*: *¥${order.totalAmount}*
📌 *状态*: ${order.status === 'PENDING_VERIFICATION' ? '⚠️ 待店主审核账单' : '✅ 待接单制作'}

📋 *饮品明细*:
${itemsText}

⏰ *下单时间*: ${order.createdAt}
────────────────
${order.paymentMethod === 'qr' ? '👉 请进入后台检查客人上传的 Bill Slip 结账单凭证！' : '👉 现金订单，请确认备餐！'}`;

                try {
                    const url = `https://api.telegram.org/bot${settings.botToken}/sendMessage`;
                    await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: settings.chatId,
                            text: message,
                            parse_mode: 'Markdown'
                        })
                    });
                } catch (err) {
                    console.error('Failed to send Telegram notification:', err);
                }
            };

            const handleSubmitOrder = async () => {
                // Validation
                let handle = telegramHandle.trim();
                if (!handle) {
                    showToast('请输入您的 Telegram @username', 'error');
                    return;
                }
                if (!handle.startsWith('@')) {
                    handle = '@' + handle;
                }

                if (cart.length === 0) {
                    showToast('购物车是空的', 'error');
                    return;
                }

                if (paymentMethod === 'qr' && !billSlip) {
                    showToast('扫码付款必须上传 Bill Slip 结账单凭证', 'error');
                    return;
                }

                setIsSubmitting(true);

                const newOrder = {
                    id: 'ORD' + Math.floor(100000 + Math.random() * 900000),
                    telegramHandle: handle,
                    items: [...cart],
                    totalAmount: cartTotal,
                    paymentMethod,
                    billSlip: paymentMethod === 'qr' ? billSlip : null,
                    // Cash orders are CONFIRMED immediately or PENDING_CASH; QR orders MUST be verified by store owner
                    status: paymentMethod === 'qr' ? 'PENDING_VERIFICATION' : 'CONFIRMED',
                    createdAt: new Date().toLocaleString('zh-CN')
                };

                // Simulate brief network delay
                await new Promise(r => setTimeout(r, 600));

                setOrders(prev => [newOrder, ...prev]);
                await sendTelegramNotification(newOrder);

                // Reset Checkout State
                setCart([]);
                setBillSlip(null);
                setIsCartOpen(false);
                setIsSubmitting(false);

                // Open Order Confirmation Popup
                setActiveOrderConfirmation(newOrder);
                showToast('下单申请已提交！', 'success');
            };

            const handleApproveOrder = (orderId) => {
                setOrders(prev => prev.map(o => {
                    if (o.id === orderId) {
                        return { ...o, status: 'CONFIRMED' };
                    }
                    return o;
                }));
                showToast(`订单 #${orderId} 凭证审核通过！`, 'success');
            };

            const handleRejectOrder = (orderId) => {
                setOrders(prev => prev.map(o => {
                    if (o.id === orderId) {
                        return { ...o, status: 'REJECTED' };
                    }
                    return o;
                }));
                showToast(`订单 #${orderId} 已驳回`, 'info');
            };

            const handleAskAi = async () => {
                if (!aiPrompt.trim()) {
                    showToast('请输入您现在的状态或口感偏好', 'error');
                    return;
                }

                setAiLoading(true);
                setAiResult(null);

                const systemInstruction = "你是一位高级奶茶调饮师与美食专家。根据用户的描述，从给定的菜单中推荐1-2款最符合需求的奶茶，并给出定制参数（糖度、冰量、加料建议）以及一句温馨懂你的推荐理由。格式要求为JSON代码块。";
                
                const userQuery = `菜单内容: ${JSON.stringify(menuItems.map(i => ({ id: i.id, name: i.name, desc: i.desc, price: i.price })))}
我的需求/心情/偏好: "${aiPrompt}"

请返回如下格式的JSON:
{
  "recommendations": [
    {
      "menuItemId": "项目ID",
      "name": "奶茶名称",
      "reason": "推荐理由",
      "suggestedOptions": {
        "sweetness": "50% 半糖",
        "ice": "少冰",
        "size": "大杯",
        "toppings": ["黑糖珍珠"]
      }
    }
  ],
  "friendlyMessage": "一句给客人的贴心暖心话"
}`;

                try {
                    const apiKey = ""; // Canvas runtime injection fallback
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-preview:generateContent?key=${apiKey}`;

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemInstruction }] },
                            generationConfig: { responseMimeType: "application/json" }
                        })
                    });

                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) {
                        const parsed = JSON.parse(text);
                        setAiResult(parsed);
                    } else {
                        throw new Error('未获取到有效的AI建议');
                    }
                } catch (err) {
                    console.error('AI Recommendation failed:', err);
                    showToast('AI 推荐暂时遇到问题，请直接选购吧', 'error');
                } finally {
                    setAiLoading(false);
                }
            };

            const addAiRecommendationToCart = (rec) => {
                const item = menuItems.find(m => m.id === rec.menuItemId || m.name === rec.name);
                if (!item) {
                    showToast('未找到对应的饮品', 'error');
                    return;
                }

                const toppings = rec.suggestedOptions?.toppings || [];
                const matchedToppings = TOPPING_OPTIONS.filter(t => toppings.includes(t.name));
                const toppingCost = matchedToppings.reduce((sum, t) => sum + t.price, 0);

                const cartItem = {
                    cartId: Date.now() + Math.random().toString(),
                    id: item.id,
                    name: item.name,
                    price: item.price + toppingCost,
                    size: rec.suggestedOptions?.size || '大杯',
                    sweetness: rec.suggestedOptions?.sweetness || '50% 半糖',
                    ice: rec.suggestedOptions?.ice || '少冰',
                    toppings: matchedToppings.map(t => t.name),
                    quantity: 1
                };

                setCart(prev => [...prev, cartItem]);
                setIsAiModalOpen(false);
                showToast(`已按AI建议加入: ${item.name}`, 'success');
            };

            // Category list filter
            const filteredMenu = useMemo(() => {
                if (selectedCategory === 'all') return menuItems;
                return menuItems.filter(item => item.category === selectedCategory);
            }, [menuItems, selectedCategory]);

            return (
                <div className="min-h-screen pb-20">
                    {/* Header Bar */}
                    <header className="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200/80 shadow-sm">
                        <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-rose-400 flex items-center justify-center text-white text-xl shadow-md shadow-amber-500/20">
                                    🧋
                                </div>
                                <div>
                                    <h1 className="font-bold text-slate-900 text-lg leading-tight">{settings.shopName}</h1>
                                    <span className="text-xs text-slate-500 font-medium">线上轻松点 • 快速配送/取餐</span>
                                </div>
                            </div>

                            {/* Nav buttons */}
                            <div className="flex items-center space-x-2">
                                {/* AI Recommender Trigger */}
                                <button
                                    onClick={() => setIsAiModalOpen(true)}
                                    className="px-3.5 py-1.5 rounded-full bg-gradient-to-r from-purple-500/10 to-pink-500/10 border border-purple-200 text-purple-700 text-xs font-semibold hover:bg-purple-100 transition flex items-center space-x-1.5 shadow-xs"
                                >
                                    <span>✨</span>
                                    <span>AI 灵感点餐</span>
                                </button>

                                {/* Switch View Mode */}
                                <button
                                    onClick={() => setViewMode(viewMode === 'customer' ? 'admin' : 'customer')}
                                    className={`px-3.5 py-1.5 rounded-full text-xs font-semibold transition border ${
                                        viewMode === 'admin' 
                                        ? 'bg-slate-900 text-white border-slate-900' 
                                        : 'bg-slate-100 text-slate-700 hover:bg-slate-200 border-slate-200'
                                    }`}
                                >
                                    {viewMode === 'customer' ? '⚙️ 店主后台' : '🧋 切换到客人点餐'}
                                </button>

                                {/* Cart Icon (Customer mode) */}
                                {viewMode === 'customer' && (
                                    <button
                                        onClick={() => setIsCartOpen(true)}
                                        className="relative p-2.5 rounded-2xl bg-amber-50 text-amber-900 hover:bg-amber-100 transition border border-amber-200"
                                    >
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                                        </svg>
                                        {cart.length > 0 && (
                                            <span className="absolute -top-1 -right-1 bg-rose-500 text-white font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow-sm">
                                                {cart.reduce((a, b) => a + b.quantity, 0)}
                                            </span>
                                        )}
                                    </button>
                                )}
                            </div>
                        </div>
                    </header>

                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed top-20 right-4 z-50 px-4 py-3 rounded-2xl shadow-xl border flex items-center space-x-2 transition-all duration-300 ${
                            toast.type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-800' :
                            toast.type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' :
                            'bg-slate-900 text-white border-slate-800'
                        }`}>
                            <span>{toast.type === 'error' ? '❌' : toast.type === 'success' ? '✅' : 'ℹ️'}</span>
                            <span className="text-sm font-medium">{toast.message}</span>
                        </div>
                    )}

                    {/* MAIN CONTENT VIEWS */}
                    {viewMode === 'customer' ? (
                        <main className="max-w-6xl mx-auto px-4 py-6">
                            {/* Banner / Hero */}
                            <div className="relative rounded-3xl bg-gradient-to-r from-amber-500 via-rose-400 to-pink-500 p-6 md:p-8 text-white overflow-hidden shadow-lg mb-8">
                                <div className="relative z-10 max-w-xl">
                                    <span className="inline-block px-3 py-1 rounded-full bg-white/20 backdrop-blur-md text-xs font-semibold tracking-wide uppercase mb-3">
                                        🧋 现熬黑糖 • 新鲜果萃
                                    </span>
                                    <h2 className="text-2xl md:text-3xl font-extrabold leading-tight mb-2">
                                        探索每一口细腻甜润与茶香
                                    </h2>
                                    <p className="text-white/90 text-xs md:text-sm mb-4">
                                        挑选您最爱的奶茶，扫码付款或现金结账。扫码请上传 Bill Slip，店主即刻审核确认！
                                    </p>
                                    <button 
                                        onClick={() => setIsAiModalOpen(true)}
                                        className="px-4 py-2 rounded-2xl bg-white text-slate-900 text-xs font-bold shadow-md hover:bg-amber-50 transition flex items-center space-x-2"
                                    >
                                        <span>✨ 不知道喝什么？让 AI 为您推荐</span>
                                    </button>
                                </div>
                                <div className="absolute right-[-20px] bottom-[-20px] opacity-20 md:opacity-30 text-9xl pointer-events-none select-none">
                                    🧋
                                </div>
                            </div>

                            {/* Category Filter Tabs */}
                            <div className="flex items-center space-x-2 overflow-x-auto pb-4 mb-6 no-scrollbar">
                                {[
                                    { id: 'all', name: '全部饮品', icon: '✨' },
                                    { id: 'classic', name: '经典奶茶', icon: '🧋' },

                                        </div>
                                    )}
                                </div>

                                {/* Cart Bottom Action */}
                                {cart.length > 0 && (
                                    <div className="pt-4 border-t border-slate-100">
                                        <div className="flex justify-between items-center mb-3">
                                            <span className="text-xs text-slate-500">应付金额:</span>
                                            <span className="text-xl font-extrabold text-amber-600">¥{cartTotal}</span>
                                        </div>
                                        <button
                                            onClick={handleSubmitOrder}
                                            disabled={isSubmitting}
                                            className="w-full py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm shadow-xl transition disabled:opacity-50"
                                        >
                                            {isSubmitting ? '正在提交订单...' : '确认下单并通知店主'}
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* ORDER SUCCESS / PENDING STATUS MODAL */}
                    {activeOrderConfirmation && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl space-y-4">
                                <div className="w-14 h-14 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-2xl mx-auto">
                                    {activeOrderConfirmation.paymentMethod === 'qr' ? '⏳' : '✅'}
                                </div>
                                <div>
                                    <h3 className="text-lg font-bold text-slate-900">
                                        {activeOrderConfirmation.paymentMethod === 'qr' ? '已收到您的点餐申请！' : '下单成功，备餐中！'}
                                    </h3>
                                    <p className="text-xs text-slate-500 mt-1">
                                        订单号: <strong className="font-mono">{activeOrderConfirmation.id}</strong>
                                    </p>
                                </div>

                                <div className="bg-slate-50 p-3 rounded-2xl border border-slate-100 text-xs text-slate-600 text-left space-y-1">
                                    <p>👤 客户 Telegram: <strong>{activeOrderConfirmation.telegramHandle}</strong></p>
                                    <p>💰 支付金额: <strong>¥{activeOrderConfirmation.totalAmount}</strong></p>
                                    <p>💳 支付形式: <strong>{activeOrderConfirmation.paymentMethod === 'qr' ? '扫码支付 (上传凭证)' : '现金支付'}</strong></p>
                                    {activeOrderConfirmation.paymentMethod === 'qr' && (
                                        <p className="text-amber-700 font-medium pt-1">
                                            📌 提示: 店主正在核对您的 Bill Slip 结账单凭证，审核通过后将即刻为您制作！
                                        </p>
                                    )}
                                </div>

                                <button 
                                    onClick={() => setActiveOrderConfirmation(null)}
                                    className="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl text-xs font-bold shadow-md transition"
                                >
                                    好的，我知道了
                                </button>
                            </div>
                        </div>
                    )}

                    {/* GEMINI AI RECOMMENDATION MODAL */}
                    {isAiModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-6 max-w-md w-full shadow-2xl animate-in zoom-in-95 duration-200">
                                <div className="flex justify-between items-start mb-4">
                                    <div className="flex items-center space-x-2">
                                        <span className="text-2xl">✨</span>
                                        <div>
                                            <h3 className="text-base font-bold text-slate-900">AI 奶茶调饮大师</h3>
                                            <p className="text-xs text-slate-400">告诉我您此刻的心清或口感偏好</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setIsAiModalOpen(false)}
                                        className="p-1 rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <div className="space-y-3 mb-4">
                                    <textarea
                                        rows={3}
                                        placeholder="例如：今天加班有点累，想喝点清爽解腻又不想要太甜的... 或者：今天天气好热，推荐一杯冰爽果茶！"
                                        value={aiPrompt}
                                        onChange={(e) => setAiPrompt(e.target.value)}
                                        className="w-full p-3 text-xs rounded-2xl border border-slate-200 focus:outline-none focus:border-amber-500 bg-slate-50"
                                    ></textarea>

                                    <div className="flex flex-wrap gap-1.5">
                                        {['🌞 炎热午后清爽点', '😴 困倦求续命提神', '🍫 想要治愈系甜品', '🥗 控糖无负担'].map(quick => (
                                            <button
                                                key={quick}
                                                onClick={() => setAiPrompt(quick.substring(2))}
                                                className="px-2.5 py-1 rounded-xl bg-purple-50 text-purple-700 text-[11px] font-semibold hover:bg-purple-100"
                                            >
                                                {quick}
                                            </button>
                                        ))}
                                    </div>

                                    <button
                                        onClick={handleAskAi}
                                        disabled={aiLoading}
                                        className="w-full py-2.5 rounded-2xl bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-700 hover:to-pink-600 text-white font-bold text-xs shadow-md transition disabled:opacity-50 flex items-center justify-center space-x-2"
                                    >
                                        {aiLoading ? (
                                            <span>✨ AI 正在为您特调设计配方...</span>
                                        ) : (
                                            <span>获取专属智能推荐</span>
                                        )}
                                    </button>
                                </div>

                                {/* AI Recommendation Result Display */}
                                {aiResult && (
                                    <div className="mt-4 pt-4 border-t border-slate-100 space-y-3">
                                        <p className="text-xs italic text-slate-600 bg-purple-50/60 p-2.5 rounded-xl border border-purple-100">
                                            💬 "{aiResult.friendlyMessage}"
                                        </p>

                                        {aiResult.recommendations?.map((rec, i) => (
                                            <div key={i} className="bg-slate-50 p-3 rounded-2xl border border-slate-200/80 space-y-2">
                                                <div className="flex justify-between items-start">
                                                    <h4 className="font-bold text-slate-900 text-xs">🧋 {rec.name}</h4>
                                                    <button
                                                        onClick={() => addAiRecommendationToCart(rec)}
                                                        className="px-2.5 py-1 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-[10px] font-bold shadow-xs"
                                                    >
                                                        ＋ 按此配方加入购物车
                                                    </button>
                                                </div>
                                                <p className="text-[11px] text-slate-500 leading-tight">{rec.reason}</p>
                                                <div className="flex flex-wrap gap-1 text-[10px] text-amber-800">
                                                    <span className="bg-amber-100 px-2 py-0.5 rounded-md font-medium">
                                                        {rec.suggestedOptions?.sweetness}
                                                    </span>
                                                    <span className="bg-amber-100 px-2 py-0.5 rounded-md font-medium">
                                                        {rec.suggestedOptions?.ice}
                                                    </span>
                                                    {rec.suggestedOptions?.toppings?.map((t, idx) => (
                                                        <span key={idx} className="bg-amber-100 px-2 py-0.5 rounded-md font-medium">
                                                            +{t}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
