<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>茶韵 · 高级奶茶点单</title>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ========== 全局重置 & 基础 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: #0b0b1a;
            color: #f0ece4;
            min-height: 100vh;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        ::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 4px;
        }

        /* ========== 通用组件 ========== */
        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px 100px;
            position: relative;
        }
        .page {
            display: none;
            animation: fadeUp 0.4s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gold-text {
            color: #d4af37;
        }
        .gold-border {
            border-color: #d4af37;
        }
        .gold-bg {
            background: linear-gradient(135deg, #d4af37, #b8962e);
        }
        .glass-card {
            background: rgba(22, 22, 46, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: rgba(212, 175, 55, 0.5);
            box-shadow: 0 16px 56px rgba(212, 175, 55, 0.08);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            letter-spacing: 0.5px;
            width: 100%;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d4af37, #b8962e);
            color: #0b0b1a;
            box-shadow: 0 6px 24px rgba(212, 175, 55, 0.3);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(212, 175, 55, 0.45);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #f0ece4;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .btn-danger {
            background: rgba(180, 40, 40, 0.7);
            color: #fff;
        }
        .btn-danger:hover {
            background: rgba(200, 50, 50, 0.9);
        }
        .btn-success {
            background: linear-gradient(135deg, #2d8f4e, #1f6b3a);
            color: #fff;
        }
        .btn-success:hover {
            box-shadow: 0 6px 24px rgba(45, 143, 78, 0.4);
        }
        .btn-sm {
            padding: 10px 18px;
            font-size: 14px;
            width: auto;
        }

        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #a0a0b8;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            color: #f0ece4;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
            font-family: inherit;
        }
        .input-group input:focus,
        .input-group textarea:focus {
            border-color: #d4af37;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.08);
        }
        .input-group input::placeholder,
        .input-group textarea::placeholder {
            color: #6a6a82;
        }
        .input-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .badge-gold {
            background: rgba(212, 175, 55, 0.2);
            color: #d4af37;
        }
        .badge-green {
            background: rgba(45, 143, 78, 0.2);
            color: #4cdb7c;
        }
        .badge-red {
            background: rgba(180, 40, 40, 0.2);
            color: #f06a6a;
        }
        .badge-orange {
            background: rgba(212, 136, 58, 0.2);
            color: #e8a84c;
        }

        /* ========== 顶部导航 ========== */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 12px;
            position: sticky;
            top: 0;
            background: rgba(11, 11, 26, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 50;
            border-bottom: 1px solid rgba(212, 175, 55, 0.08);
        }
        .top-bar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .top-bar .brand i {
            color: #d4af37;
            font-size: 26px;
        }
        .top-bar .brand span {
            background: linear-gradient(135deg, #f0d080, #b8962e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .top-bar .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .top-bar .actions button {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #c0c0d0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .top-bar .actions button:hover {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
        }
        .top-bar .actions .cart-btn {
            position: relative;
        }
        .top-bar .actions .cart-btn .count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #d4af37;
            color: #0b0b1a;
            font-size: 11px;
            font-weight: 700;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ========== 菜单分类 ========== */
        .category-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 12px 0 16px;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .category-tabs::-webkit-scrollbar {
            display: none;
        }
        .category-tabs .tab {
            flex-shrink: 0;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.04);
            color: #a0a0b8;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .category-tabs .tab:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #f0ece4;
        }
        .category-tabs .tab.active {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            border-color: rgba(212, 175, 55, 0.3);
        }

        /* ========== 商品卡片 ========== */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 4px;
        }
        .menu-item {
            background: rgba(22, 22, 46, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 16px 14px 14px;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .menu-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #d4af37, #f0d080);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .menu-item:hover {
            border-color: rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .menu-item:hover::before {
            opacity: 1;
        }
        .menu-item .icon {
            font-size: 28px;
            margin-bottom: 6px;
            display: block;
        }
        .menu-item .name {
            font-size: 15px;
            font-weight: 600;
            color: #f0ece4;
            margin-bottom: 2px;
        }
        .menu-item .desc {
            font-size: 12px;
            color: #8888a0;
            margin-bottom: 8px;
            line-height: 1.3;
            min-height: 32px;
        }
        .menu-item .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-item .price {
            font-size: 17px;
            font-weight: 700;
            color: #d4af37;
        }
        .menu-item .price small {
            font-size: 12px;
            font-weight: 400;
            color: #8888a0;
        }
        .menu-item .add-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .menu-item .add-btn:hover {
            background: #d4af37;
            color: #0b0b1a;
            transform: scale(1.05);
        }

        /* ========== 购物车浮窗 ========== */
        .cart-floating {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22, 22, 46, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 60px;
            padding: 10px 20px 10px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.8);
            z-index: 100;
            max-width: 92%;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .cart-floating.hidden {
            transform: translateX(-50%) translateY(80px);
            opacity: 0;
            pointer-events: none;
        }
        .cart-floating .info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        .cart-floating .info .count {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            padding: 2px 12px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
        }
        .cart-floating .info .total {
            font-size: 18px;
            font-weight: 700;
            color: #f0ece4;
        }
        .cart-floating .info .total .currency {
            color: #d4af37;
            font-weight: 400;
        }
        .cart-floating .checkout-btn {
            padding: 10px 24px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #d4af37, #b8962e);
            color: #0b0b1a;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .cart-floating .checkout-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 24px rgba(212, 175, 55, 0.3);
        }

        /* ========== 结账页面 ========== */
        .checkout-section {
            margin-top: 8px;
        }
        .checkout-section .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #d4af37;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkout-section .section-title i {
            font-size: 18px;
        }

        .dining-options {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .dining-options .option {
            flex: 1;
            padding: 14px;
            text-align: center;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 500;
            font-size: 14px;
        }
        .dining-options .option i {
            display: block;
            font-size: 22px;
            margin-bottom: 4px;
        }
        .dining-options .option.active {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.08);
            color: #d4af37;
        }
        .dining-options .option:hover {
            border-color: rgba(212, 175, 55, 0.3);
        }

        .payment-options {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .payment-options .option {
            flex: 1;
            padding: 14px;
            text-align: center;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.25s ease;
            font-weight: 500;
            font-size: 14px;
        }
        .payment-options .option i {
            display: block;
            font-size: 22px;
            margin-bottom: 4px;
        }
        .payment-options .option.active {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.08);
            color: #d4af37;
        }
        .payment-options .option:hover {
            border-color: rgba(212, 175, 55, 0.3);
        }

        .upload-area {
            border: 2px dashed rgba(212, 175, 55, 0.2);
            border-radius: 16px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
            margin-bottom: 16px;
            position: relative;
        }
        .upload-area:hover {
            border-color: #d4af37;
            background: rgba(212, 175, 55, 0.04);
        }
        .upload-area i {
            font-size: 36px;
            color: #d4af37;
            margin-bottom: 8px;
            display: block;
        }
        .upload-area .hint {
            color: #8888a0;
            font-size: 14px;
        }
        .upload-area img {
            max-width: 100%;
            max-height: 180px;
            border-radius: 12px;
            margin-top: 10px;
        }
        .upload-area .remove-img {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: none;
        }
        .upload-area.has-img .remove-img {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .order-summary {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 16px;
            margin: 16px 0;
        }
        .order-summary .item-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .order-summary .item-row:last-child {
            border-bottom: none;
        }
        .order-summary .total-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0 4px;
            font-size: 18px;
            font-weight: 700;
            border-top: 2px solid rgba(212, 175, 55, 0.15);
            margin-top: 6px;
        }
        .order-summary .total-row .price {
            color: #d4af37;
        }

        /* ========== 后台 ========== */
        .admin-login {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .admin-login .lock-icon {
            font-size: 64px;
            color: #d4af37;
            margin-bottom: 20px;
        }
        .admin-login .title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .admin-login .sub {
            color: #8888a0;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .admin-panel .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .admin-panel .stats .stat-item {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
        }
        .admin-panel .stats .stat-item .num {
            font-size: 24px;
            font-weight: 700;
            color: #d4af37;
        }
        .admin-panel .stats .stat-item .label {
            font-size: 12px;
            color: #8888a0;
            margin-top: 2px;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
        }
        .order-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .order-card:hover {
            border-color: rgba(212, 175, 55, 0.15);
            background: rgba(255, 255, 255, 0.06);
        }
        .order-card .top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }
        .order-card .top-row .customer {
            font-weight: 600;
            font-size: 15px;
        }
        .order-card .top-row .customer small {
            font-weight: 400;
            color: #8888a0;
            font-size: 13px;
            margin-left: 6px;
        }
        .order-card .top-row .status {
            font-size: 12px;
            font-weight: 600;
        }
        .order-card .items-preview {
            font-size: 13px;
            color: #a0a0b8;
            margin-bottom: 6px;
        }
        .order-card .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #8888a0;
        }
        .order-card .bottom-row .total {
            font-weight: 700;
            color: #d4af37;
            font-size: 16px;
        }

        /* ========== 订单详情弹窗 ========== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.show {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-content {
            background: #1a1a2e;
            border-radius: 24px;
            padding: 28px 24px;
            max-width: 440px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(212, 175, 55, 0.15);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.8);
            animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .modal-content .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .modal-content .modal-title .close {
            background: none;
            border: none;
            color: #8888a0;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.25s;
        }
        .modal-content .modal-title .close:hover {
            color: #f0ece4;
        }
        .modal-content .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 14px;
        }
        .modal-content .detail-row .label {
            color: #8888a0;
        }
        .modal-content .detail-row .value {
            color: #f0ece4;
            text-align: right;
            max-width: 60%;
            word-break: break-all;
        }
        .modal-content .payment-image {
            margin: 12px 0;
            border-radius: 14px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
        }
        .modal-content .payment-image img {
            width: 100%;
            display: block;
        }
        .modal-content .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .modal-content .modal-actions .btn {
            flex: 1;
            min-width: 100px;
        }

        /* ========== 设置页面 ========== */
        .settings-group {
            margin-top: 16px;
        }
        .settings-group .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;

        /* ========== Toast 通知 ========== */
        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
            max-width: 90%;
        }
        .toast {
            background: rgba(22, 22, 46, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 16px;
            padding: 14px 24px;
            color: #f0ece4;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.success {
            border-color: rgba(45, 143, 78, 0.3);
        }
        .toast.error {
            border-color: rgba(180, 40, 40, 0.3);
        }
        .toast i {
            font-size: 18px;
        }
        .toast.success i {
            color: #4cdb7c;
        }
        .toast.error i {
            color: #f06a6a;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ========== 响应式 ========== */
        @media (max-width: 400px) {
            .container {
                padding: 12px 12px 100px;
            }
            .menu-grid {
                gap: 10px;
            }
            .menu-item {
                padding: 12px 10px;
            }
            .menu-item .name {
                font-size: 14px;
            }
            .cart-floating {
                padding: 8px 14px 8px 18px;
                gap: 10px;
            }
            .cart-floating .info .total {
                font-size: 16px;
            }
            .cart-floating .checkout-btn {
                padding: 8px 16px;
                font-size: 13px;
            }
            .modal-content {
                padding: 20px 16px;
            }
            .admin-panel .stats {
                grid-template-columns: 1fr 1fr;
            }
        }
        @media (min-width: 600px) {
            .container {
                max-width: 560px;
            }
            .menu-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }

        /* ========== 工具类 ========== */
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .mt-24 {
            margin-top: 24px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .mb-16 {
            margin-bottom: 16px;
        }
        .gap-8 {
            gap: 8px;
        }
        .flex {
            display: flex;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hidden {
            display: none !important;
        }
        .w-full {
            width: 100%;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #8888a0;
        }
        .empty-state i {
            font-size: 48px;
            color: #2a2a42;
            margin-bottom: 12px;
            display: block;
        }
        .empty-state .text {
            font-size: 15px;
        }
    </style>
</head>
<body>

    <!-- ========== TOAST 容器 ========== -->
    <div class="toast-container" id="toastContainer"></div>

                <!-- 扫码上传 -->

        <!-- ===== 页面：订单完成 ===== -->

                                </div>
                                <div style="display:flex;gap:8px;align-items:center;">

                    <span style="font-size:13px;color:#8888a0;" id="orderCountLabel">0 笔</span>
                </div>
                <div class="order-list" id="adminOrderList">

    <!-- ========== 购物车浮窗 ========== -->

            <span class="count" id="cartFloatingCount">0</span>
            <span class="total"><span class="currency">¥</span><span id="cartFloatingTotal">0.00</span></span>
        </div>
        <button class="checkout-btn" id="cartCheckoutBtn">
            去结账 <i class="fas fa-arrow-right"></i>
        </button>
    </div>

    <script>
        // ================================================================
        //  DATA
        // ================================================================
        const DEFAULT_MENU = [{
            id: 1,
            category: '经典奶茶',
            name: '珍珠奶茶',
            desc: 'Q弹珍珠 · 经典风味',
            price: 15,
            icon: '🧋'
        }, {
            id: 2,
            category: '经典奶茶',
            name: '椰香奶茶',
            desc: '浓郁椰香 · 丝滑口感',
            price: 17,
            icon: '🥥'
        }, {
            id: 3,
            category: '经典奶茶',
            name: '焦糖奶茶',
            desc: '焦糖香甜 · 暖心之选',
            price: 16,
            icon: '🍬'
        }, {
            id: 4,
            category: '鲜果茶',
            name: '满杯红柚',
            desc: '鲜红柚汁 · 清爽解腻',
            price: 20,
            icon: '🍊'
        }, {
            id: 5,
            category: '鲜果茶',
            name: '金桔柠檬',
            desc: '金桔+柠檬 · 酸甜醒神',
            price: 18,
            icon: '🍋'
        }, {
            id: 6,
            category: '鲜果茶',
            name: '百香果茶',
            desc: '百香果粒 · 热带风情',
            price: 19,
            icon: '🍈'
        }, {
            id: 7,
            category: '芝士茶',
            name: '芝士奶盖绿',
            desc: '海盐奶盖 · 茉莉茶底',
            price: 22,
            icon: '🧀'
        }, {
            id: 8,
            category: '芝士茶',
            name: '芝士草莓',
            desc: '鲜草莓+芝士奶盖',
            price: 24,
            icon: '🍓'
        }, {
            id: 9,
            category: '芝士茶',
            name: '芝士黑提',
            desc: '黑提果肉 · 芝香浓郁',
            price: 23,
            icon: '🍇'
        }];

        // ================================================================
        //  STATE
        // ================================================================
        let state = {
            menu: [],
            categories: [],
            cart: [], // { id, name, price, quantity }
            orders: [], // 完整订单
            settings: {
                telegramId: '@店主_茶韵',
                adminPassword: '123456'
            },
            currentCategory: '',
            customerName: '',
            diningType: '店内',
            diningDetail: '',
            paymentMethod: '现金',
            paymentImage: null, // base64
            isAdminLoggedIn: false,
            selectedOrderId: null,
        };

        // ================================================================
        //  DOM REFS
        // ================================================================
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);

        const dom = {
            pageMenu: $('#pageMenu'),
            pageCheckout: $('#pageCheckout'),
            pageSuccess: $('#pageSuccess'),
            pageAdminLogin: $('#pageAdminLogin'),
            pageAdminPanel: $('#pageAdminPanel'),

            categoryTabs: $('#categoryTabs'),
            menuGrid: $('#menuGrid'),
            emptyState: $('#emptyState'),

            cartFloating: $('#cartFloating'),
            cartFloatingCount: $('#cartFloatingCount'),
            cartFloatingTotal: $('#cartFloatingTotal'),
            cartCount: $('#cartCount'),
            cartBtn: $('#cartBtn'),
            cartCheckoutBtn: $('#cartCheckoutBtn'),

            customerName: $('#customerName'),
            diningOptions: $$('#diningOptions .option'),
            diningDetail: $('#diningDetail'),
            diningDetailLabel: $('#diningDetailLabel'),
            diningDetailGroup: $('#diningDetailGroup'),
            paymentOptions: $$('#paymentOptions .option'),
            uploadAreaWrapper: $('#uploadAreaWrapper'),
            uploadArea: $('#uploadArea'),
            fileInput: $('#fileInput'),
            removeImgBtn: $('#removeImgBtn'),

            summaryItems: $('#summaryItems'),
            summaryTotal: $('#summaryTotal'),
            submitOrderBtn: $('#submitOrderBtn'),
            backToMenuBtn: $('#backToMenuBtn'),

            successOrderId: $('#successOrderId'),
            successStatus: $('#successStatus'),
            successMessage: $('#successMessage'),
            continueShoppingBtn: $('#continueShoppingBtn'),

            adminEntrance: $('#adminEntrance'),
            adminPasswordInput: $('#adminPasswordInput'),
            adminLoginBtn: $('#adminLoginBtn'),
            adminLoginBackBtn: $('#adminLoginBackBtn'),
            adminLogoutBtn: $('#adminLogoutBtn'),
            adminSettingsBtn: $('#adminSettingsBtn'),
            adminSettingsPanel: $('#adminSettingsPanel'),
            closeSettingsBtn: $('#closeSettingsBtn'),
            adminTelegramIdInput: $('#adminTelegramIdInput'),
            saveTelegramIdBtn: $('#saveTelegramIdBtn'),
            adminNewPasswordInput: $('#adminNewPasswordInput'),
            savePasswordBtn: $('#savePasswordBtn'),
            adminOrderList: $('#adminOrderList'),
            statTotal: $('#statTotal'),
            statPending: $('#statPending'),
            statConfirmed: $('#statConfirmed'),
            orderCountLabel: $('#orderCountLabel'),

            modal: $('#orderModal'),
            modalBody: $('#modalBody'),
            modalCloseBtn: $('#modalCloseBtn'),

            toastContainer: $('#toastContainer'),
        };

        // ================================================================
        //  HELPERS
        // ================================================================
        function genId() {
            const d = new Date();
            const ts = d.getFullYear() +
                String(d.getMonth() + 1).padStart(2, '0') +
                String(d.getDate()).padStart(2, '0') + '-' +
                String(d.getHours()).padStart(2, '0') +
                String(d.getMinutes()).padStart(2, '0') +
                String(d.getSeconds()).padStart(2, '0');
            const rand = String(Math.floor(Math.random() * 1000)).padStart(3, '0');
            return 'CH' + ts + rand;
        }

        function formatPrice(v) { return v.toFixed(2); }

        function getCartTotal() {
            return state.cart.reduce((s, i) => s + i.price * i.quantity, 0);
        }

        function getCartCount() {
            return state.cart.reduce((s, i) => s + i.quantity, 0);
        }

        function saveState() {
            try {
                localStorage.setItem('teaShop_state', JSON.stringify({
                    menu: state.menu,
                    orders: state.orders,
                    settings: state.settings,
                }));
            } catch (e) {}
        }

        function loadState() {
            try {
                const raw = localStorage.getItem('teaShop_state');
                if (raw) {
                    const data = JSON.parse(raw);
                    state.menu = data.menu || [];
                    state.orders = data.orders || [];
                    state.settings = data.settings || state.settings;
                }
            } catch (e) {}
            if (!state.menu.length) {
                state.menu = JSON.parse(JSON.stringify(DEFAULT_MENU));
            }
            // 提取分类
            const cats = new Set();
            state.menu.forEach(item => cats.add(item.category));
            state.categories = Array.from(cats);
            if (state.categories.length) state.currentCategory = state.categories[0];
        }

        function showToast(text, type = 'info', duration = 3000) {
            const icons = {
                info: 'fa-info-circle',
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
            };
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${text}`;
            dom.toastContainer.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(-10px)';
                setTimeout(() => el.remove(), 300);
            }, duration);
        }

        // ================================================================
        //  RENDER: MENU
        // ================================================================
        function renderCategories() {
            const container = dom.categoryTabs;
            container.innerHTML = '';
            state.categories.forEach((cat, idx) => {
                const tab = document.createElement('div');
                tab.className = `tab${idx === 0 ? ' active' : ''}`;
                tab.textContent = cat;
                tab.dataset.cat = cat;
                tab.addEventListener('click', () => {
                    state.currentCategory = cat;
                    renderCategories();
                    renderMenu();
                });
                container.appendChild(tab);
            });
            // 激活高亮
            const tabs = container.querySelectorAll('.tab');
            tabs.forEach(t => {
                t.classList.toggle('active', t.dataset.cat === state.currentCategory);
            });
        }

        function renderMenu() {
            const grid = dom.menuGrid;
            const empty = dom.emptyState;
            const items = state.menu.filter(i => i.category === state.currentCategory);
            if (!items.length) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';
            grid.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'menu-item';
                const inCart = state.cart.find(c => c.id === item.id);
                const qty = inCart ? inCart.quantity : 0;
                card.innerHTML = `
              <span class="icon">${item.icon || '🧋'}</span>
              <div class="name">${item.name}</div>
              <div class="desc">${item.desc || ''}</div>
              <div class="bottom">
                <span class="price">¥${formatPrice(item.price)}</span>
                <button class="add-btn" data-id="${item.id}">
                  <i class="fas fa-plus"></i>
                </button>
              </div>
              ${qty > 0 ? `<div style="position:absolute;top:8px;right:12px;background:rgba(212,175,55,0.2);color:#d4af37;font-size:12px;font-weight:700;padding:2px 10px;border-radius:50px;">×${qty}</div>` : ''}
            `;
                card.querySelector('.add-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    addToCart(item.id);
                });
                grid.appendChild(card);
            });
        }

        // ================================================================
        //  CART
        // ================================================================
        function addToCart(itemId) {
            const item = state.menu.find(i => i.id === itemId);
            if (!item) return;
            const existing = state.cart.find(c => c.id === itemId);
            if (existing) {
                existing.quantity += 1;
            } else {
                state.cart.push({ id: item.id, name: item.name, price: item.price, quantity: 1 });
            }
            updateCartUI();
            showToast(`已添加 ${item.name}`, 'success', 1500);
        }

        function removeFromCart(itemId) {
            const idx = state.cart.findIndex(c => c.id === itemId);
            if (idx === -1) return;
            const item = state.cart[idx];
            if (item.quantity > 1) {
                item.quantity -= 1;
            } else {
                state.cart.splice(idx, 1);
            }
            updateCartUI();
        }

        function updateCartUI() {
            const count = getCartCount();
            const total = getCartTotal();
            dom.cartCount.textContent = count;
            dom.cartFloatingCount.textContent = count;
            dom.cartFloatingTotal.textContent = formatPrice(total);
            dom.cartFloating.classList.toggle('hidden', count === 0);
            // 更新菜单上的数量标签
            renderMenu();
            // 如果结账页打开，更新摘要
            if (dom.pageCheckout.classList.contains('active')) {
                renderSummary();
            }
        }

        // ================================================================
        //  RENDER: CHECKOUT SUMMARY
        // ================================================================
        function renderSummary() {
            const container = dom.summaryItems;
            container.innerHTML = '';
            if (!state.cart.length) {
                container.innerHTML = '<div style="color:#8888a0;text-align:center;padding:12px 0;">购物车为空</div>';
                dom.summaryTotal.textContent = '0.00';
                return;
            }
            state.cart.forEach(item => {
                const row = document.createElement('div');
                row.className = 'item-row';
                row.innerHTML = `
              <span>${item.name} × ${item.quantity}</span>
              <span>¥${formatPrice(item.price * item.quantity)}</span>
            `;
                container.appendChild(row);
            });
            dom.summaryTotal.textContent = formatPrice(getCartTotal());
        }

        // ================================================================
        //  NAVIGATION
        // ================================================================
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            const page = document.getElementById(pageId);
            if (page) page.classList.add('active');
            // 更新购物车浮窗可见性
            if (pageId === 'pageMenu') {
                updateCartUI();
            } else {
                dom.cartFloating.classList.add('hidden');
            }
            // 滚动到顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ================================================================
        //  CHECKOUT FLOW
        // ================================================================
        function openCheckout() {
            if (!state.cart.length) {
                showToast('请先添加商品', 'error');
                return;
            }
            // 填充顾客名
            dom.customerName.value = state.customerName || '';
            // 用餐方式
            const diningOpts = dom.diningOptions;
            diningOpts.forEach(opt => {
                opt.classList.toggle('active', opt.dataset.value === state.diningType);
            });
            dom.diningDetail.value = state.diningDetail || '';
            updateDiningLabel();

            // 付款方式
            const payOpts = dom.paymentOptions;
            payOpts.forEach(opt => {
                opt.classList.toggle('active', opt.dataset.value === state.paymentMethod);
            });
            toggleUploadArea(state.paymentMethod === '扫码');

            // 摘要
            renderSummary();
            showPage('pageCheckout');
        }

        function updateDiningLabel() {
            const is店内 = state.diningType === '店内';
            dom.diningDetailLabel.textContent = is店内 ? '桌号' : '配送地址';
            dom.diningDetail.placeholder = is店内 ? '例如 A01' : '请输入详细地址';
        }

        function toggleUploadArea(show) {
            dom.uploadAreaWrapper.style.display = show ? 'block' : 'none';
        }

        function submitOrder() {
            // 验证
            const name = dom.customerName.value.trim();
            if (!name) {
                showToast('请填写您的 Telegram ID / 昵称', 'error');
                return;
            }
            state.customerName = name;

            const diningType = state.diningType;
            const diningDetail = dom.diningDetail.value.trim();
            if (!diningDetail) {
                showToast(diningType === '店内' ? '请填写桌号' : '请填写配送地址', 'error');
                return;
            }
            state.diningDetail = diningDetail;

            const paymentMethod = state.paymentMethod;
            if (paymentMethod === '扫码') {
                if (!state.paymentImage) {
                    showToast('请上传付款截图', 'error');
                    return;
                }
            }

            if (!state.cart.length) {
                showToast('购物车为空', 'error');
                return;
            }

            // 构建订单
            const order = {
                id: genId(),
                customerName: name,
                items: JSON.parse(JSON.stringify(state.cart)),
                total: getCartTotal(),
                diningType: diningType,
                diningDetail: diningDetail,
                paymentMethod: paymentMethod,
                paymentImage: state.paymentImage || null,
                status: paymentMethod === '现金' ? '已确认' : '待确认', // 现金直接确认，扫码待确认
                createdAt: new Date().toLocaleString('zh-CN', { hour12: false }),
                rawTimestamp: Date.now(),
            };

            state.orders.unshift(order);
            saveState();

            // 清空购物车
            state.cart = [];
            updateCartUI();

            // 清空付款图片
            state.paymentImage = null;
            dom.fileInput.value = '';
            dom.uploadArea.classList.remove('has-img');
            dom.uploadArea.querySelector('img')?.remove();

            // 显示成功页
            dom.successOrderId.textContent = order.id;
            dom.successStatus.textContent = order.status;
            dom.successMessage.textContent = paymentMethod === '现金' ?
                '✅ 现金付款已确认，请等待制作完成。' :
                '⏳ 扫码付款等待店主确认，请留意通知。';

            showPage('pageSuccess');

            // 模拟 Telegram 通知（在后台订单列表可见）
            const tgId = state.settings.telegramId || '店主';
            console.log(`[Telegram 通知] 发送至 ${tgId}: 新订单 ${order.id}，客户 ${order.customerName}，总计 ¥${formatPrice(order.total)}`);
            showToast(`📨 已通知店主 (${tgId})`, 'success', 2000);
        }

        // ================================================================
        //  ADMIN
        // ================================================================
        function adminLogin() {
            const pwd = dom.adminPasswordInput.value.trim();
            if (pwd === state.settings.adminPassword) {
                state.isAdminLoggedIn = true;
                dom.adminPasswordInput.value = '';
                renderAdminPanel();
                showPage('pageAdminPanel');
                showToast('登录成功', 'success');
            } else {
                showToast('密码错误', 'error');
            }
        }

        function renderAdminPanel() {
            const orders = state.orders;
            const total = orders.length;
            const pending = orders.filter(o => o.status === '待确认').length;
            const confirmed = orders.filter(o => o.status === '已确认').length;

            dom.statTotal.textContent = total;
            dom.statPending.textContent = pending;
            dom.statConfirmed.textContent = confirmed;
            dom.orderCountLabel.textContent = `${total} 笔`;

            const list = dom.adminOrderList;
            if (!orders.length) {
                list.innerHTML = `
              <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <div class="text">暂无订单</div>
              </div>
            `;
                return;
            }

            list.innerHTML = '';
            orders.forEach((order, idx) => {
                const card = document.createElement('div');
                card.className = 'order-card';
                const statusMap = {
                    '待确认': '<span class="badge badge-orange">待确认</span>',
                    '已确认': '<span class="badge badge-green">已确认</span>',
                };
                const itemsStr = order.items.map(i => `${i.name}×${i.quantity}`).join('、');
                const payIcon = order.paymentMethod === '现金' ? '💵' : '📱';
                card.innerHTML = `
              <div class="top-row">
                <div class="customer">
                  ${order.customerName}
                  <small>${payIcon} ${order.paymentMethod}</small>
                </div>
                <div class="status">${statusMap[order.status] || order.status}</div>
              </div>
              <div class="items-preview">${itemsStr}</div>
              <div class="bottom-row">
                <span>${order.diningType} · ${order.diningDetail}</span>
                <span class="total">¥${formatPrice(order.total)}</span>
              </div>
              <div style="font-size:12px;color:#6a6a82;margin-top:4px;">${order.createdAt}</div>
            `;
                card.addEventListener('click', () => openOrderDetail(order.id));
                list.appendChild(card);
            });
        }

        function openOrderDetail(orderId) {
            const order = state.orders.find(o => o.id === orderId);
            if (!order) return;
            state.selectedOrderId = orderId;

            const body = dom.modalBody;
            const statusMap = {
                '待确认': '<span class="badge badge-orange">待确认</span>',
                '已确认': '<span class="badge badge-green">已确认</span>',
            };
            const itemsHtml = order.items.map(i =>
                `<div class="detail-row"><span class="label">${i.name} × ${i.quantity}</span><span class="value">¥${formatPrice(i.price * i.quantity)}</span></div>`
            ).join('');

            let paymentImageHtml = '';
            if (order.paymentImage) {
                paymentImageHtml = `
              <div class="payment-image">
                <img src="${order.paymentImage}" alt="付款截图" />
              </div>
            `;
            }

            const isPending = order.status === '待确认';

            body.innerHTML = `
            <div class="detail-row"><span class="label">订单号</span><span class="value" style="color:#d4af37;font-weight:600;">${order.id}</span></div>
            <div class="detail-row"><span class="label">客户</span><span class="value">${order.customerName}</span></div>
            <div class="detail-row"><span class="label">用餐方式</span><span class="value">${order.diningType} · ${order.diningDetail}</span></div>
            <div class="detail-row"><span class="label">付款方式</span><span class="value">${order.paymentMethod}</span></div>
            <div class="detail-row"><span class="label">状态</span><span class="value">${statusMap[order.status] || order.status}</span></div>
            <div class="detail-row"><span class="label">时间</span><span class="value">${order.createdAt}</span></div>
            <div style="margin:10px 0 4px;font-weight:600;color:#d4af37;">商品明细</div>
            ${itemsHtml}
            <div class="detail-row" style="border-top:2px solid rgba(212,175,55,0.15);margin-top:6px;padding-top:12px;font-weight:700;">
              <span class="label">总计</span>
              <span class="value" style="color:#d4af37;font-size:18px;">¥${formatPrice(order.total)}</span>
            </div>
            ${paymentImageHtml}
            <div class="modal-actions">
              ${isPending ? `<button class="btn btn-success btn-sm" id="modalConfirmBtn"><i class="fas fa-check"></i> 确认订单</button>` : ''}
              ${isPending ? `<button class="btn btn-danger btn-sm" id="modalCancelBtn"><i class="fas fa-times"></i> 取消订单</button>` : ''}
              <button class="btn btn-secondary btn-sm" id="modalCloseBtn2">关闭</button>
            </div>
          `;

            dom.modal.classList.add('show');

            // 事件绑定
            const closeModal = () => dom.modal.classList.remove('show');
            dom.modal.querySelector('#modalCloseBtn2')?.addEventListener('click', closeModal);

            if (isPending) {
                dom.modal.querySelector('#modalConfirmBtn')?.addEventListener('click', () => {
                    confirmOrder(order.id);
                    closeModal();
                });
                dom.modal.querySelector('#modalCancelBtn')?.addEventListener('click', () => {
                    cancelOrder(order.id);
                    closeModal();
                });
            }
        }

        function confirmOrder(orderId) {
            const order = state.orders.find(o => o.id === orderId);
            if (!order) return;
            if (order.status === '已确认') {
                showToast('订单已确认', 'info');
                return;
            }
            order.status = '已确认';
            saveState();
            renderAdminPanel();
            showToast(`✅ 订单 ${orderId} 已确认`, 'success');
            // 模拟通知
            const tgId = state.settings.telegramId || '店主';
            console.log(`[Telegram 通知] 发送至 ${tgId}: 订单 ${orderId} 已确认`);
        }

        function cancelOrder(orderId) {
            const idx = state.orders.findIndex(o => o.id === orderId);
            if (idx === -1) return;
            state.orders.splice(idx, 1);
            saveState();
            renderAdminPanel();
            showToast(`已取消订单 ${orderId}`, 'error');
        }

        // ================================================================
        //  SETTINGS
        // ================================================================
        function openSettings() {
            dom.adminTelegramIdInput.value = state.settings.telegramId || '';
            dom.adminNewPasswordInput.value = '';
            dom.adminSettingsPanel.style.display = 'block';
        }

        function saveTelegramId() {
            const val = dom.adminTelegramIdInput.value.trim();
            if (!val) {
                showToast('请输入有效的 Telegram ID', 'error');
                return;
            }
            state.settings.telegramId = val;
            saveState();
            showToast('✅ Telegram ID 已更新', 'success');
        }

        function savePassword() {
            const val = dom.adminNewPasswordInput.value.trim();
            if (val.length < 6) {
                showToast('密码至少6位', 'error');
                return;
            }
            state.settings.adminPassword = val;
            saveState();
            dom.adminNewPasswordInput.value = '';
            showToast('✅ 密码已更新', 'success');
        }

        // ================================================================
        //  EVENTS
        // ================================================================
        function init() {
            loadState();
            renderCategories();
            renderMenu();
            updateCartUI();

            // 购物车按钮
            dom.cartBtn.addEventListener('click', openCheckout);
            dom.cartCheckoutBtn.addEventListener('click', openCheckout);

            // 返回菜单
            dom.backToMenuBtn.addEventListener('click', () => {
                showPage('pageMenu');
                updateCartUI();
            });

            // 继续点单
            dom.continueShoppingBtn.addEventListener('click', () => {
                showPage('pageMenu');
                updateCartUI();
            });

            // 用餐方式切换
            dom.diningOptions.forEach(opt => {
                opt.addEventListener('click', () => {
                    dom.diningOptions.forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                    state.diningType = opt.dataset.value;
                    updateDiningLabel();
                });
            });

            // 付款方式切换
            dom.paymentOptions.forEach(opt => {
                opt.addEventListener('click', () => {
                    dom.paymentOptions.forEach(o => o.classList.remove('active'));
                    opt.classList.add('active');
                    state.paymentMethod = opt.dataset.value;
                    toggleUploadArea(state.paymentMethod === '扫码');
                    if (state.paymentMethod === '现金') {
                        // 清除图片
                        state.paymentImage = null;
                        dom.fileInput.value = '';
                        dom.uploadArea.classList.remove('has-img');
                        dom.uploadArea.querySelector('img')?.remove();
                    }
                });
            });

            // 上传图片
            dom.uploadArea.addEventListener('click', () => {
                dom.fileInput.click();
            });
            dom.fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const base64 = ev.target.result;
                    state.paymentImage = base64;
                    dom.uploadArea.classList.add('has-img');
                    // 移除旧的img
                    dom.uploadArea.querySelector('img')?.remove();
                    const img = document.createElement('img');
                    img.src = base64;
                    dom.uploadArea.appendChild(img);
                    showToast('✅ 截图已上传', 'success');
                };
                reader.readAsDataURL(file);
            });
            dom.removeImgBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                state.paymentImage = null;
                dom.fileInput.value = '';
                dom.uploadArea.classList.remove('has-img');
                dom.uploadArea.querySelector('img')?.remove();
            });

            // 提交订单
            dom.submitOrderBtn.addEventListener('click', submitOrder);

            // 后台入口
            dom.adminEntrance.addEventListener('click', () => {
                if (state.isAdminLoggedIn) {
                    renderAdminPanel();
                    showPage('pageAdminPanel');
                } else {
                    dom.adminPasswordInput.value = '';
                    showPage('pageAdminLogin');
                }
            });

            // 后台登录
            dom.adminLoginBtn.addEventListener('click', adminLogin);
            dom.adminPasswordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') adminLogin();
            });
            dom.adminLoginBackBtn.addEventListener('click', () => {
                showPage('pageMenu');
                updateCartUI();
            });

            // 后台退出
            dom.adminLogoutBtn.addEventListener('click', () => {
                state.isAdminLoggedIn = false;
                showPage('pageMenu');
                updateCartUI();
                showToast('已退出后台', 'info');
            });

            // 后台设置
            dom.adminSettingsBtn.addEventListener('click', () => {
                if (dom.adminSettingsPanel.style.display === 'block') {
                    dom.adminSettingsPanel.style.display = 'none';
                } else {
                    openSettings();
                }
            });
            dom.closeSettingsBtn.addEventListener('click', () => {
                dom.adminSettingsPanel.style.display = 'none';
            });
            dom.saveTelegramIdBtn.addEventListener('click', saveTelegramId);
            dom.savePasswordBtn.addEventListener('click', savePassword);

            // 弹窗关闭
            dom.modalCloseBtn.addEventListener('click', () => {
                dom.modal.classList.remove('show');
            });
            dom.modal.addEventListener('click', (e) => {
                if (e.target === dom.modal) dom.modal.classList.remove('show');
            });

            // 键盘快捷键 ESC 关闭弹窗
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') dom.modal.classList.remove('show');
            });

            // 自动清理过期的图片数据（不做）

            // 如果订单列表有数据，后台统计
            console.log('🍵 茶韵点单系统已启动');
            console.log(`📦 ${state.orders.length} 笔历史订单`);
            console.log(`👤 店主 ID: ${state.settings.telegramId}`);

            // 如果是从后台退出的状态，确保页面正确
            if (state.isAdminLoggedIn) {
                // 但不自动跳转，保持菜单页
            }
        }

        // 暴露一些功能到全局，便于调试
        window.__teaShop = {
            state,
            addToCart,
            removeFromCart,
            submitOrder,
            confirmOrder,
            cancelOrder,
            saveState,
            renderAdminPanel,
        };

        // 启动
        document.addEventListener('DOMContentLoaded', init);
    </script>

</body>
</html>
