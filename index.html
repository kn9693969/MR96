<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能仓库管理系统</title>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ---------- 全局重置 & 变量 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --primary-dark: #3730a3;
            --primary-bg: #eef2ff;
            --success: #22c55e;
            --success-bg: #dcfce7;
            --danger: #ef4444;
            --danger-bg: #fee2e2;
            --warning: #f59e0b;
            --warning-bg: #fef3c7;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -1px rgba(0, 0, 0, 0.04);
            --shadow-lg: 0 10px 25px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.03);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
        }

        body {
            background: var(--gray-50);
            color: var(--gray-800);
            min-height: 100vh;
            padding: 24px;
        }

        /* ---------- 布局容器 ---------- */
        .app-container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ---------- 顶部导航 ---------- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 28px;
            border: 1px solid var(--gray-200);
            flex-wrap: wrap;
            gap: 12px;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 700;
            color: var(--gray-900);
        }

        .navbar-brand i {
            color: var(--primary);
            font-size: 28px;
        }

        .navbar-brand span {
            background: var(--primary-bg);
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            margin-left: 4px;
        }

        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--gray-100);
            border-radius: 30px;
            padding: 0 16px;
            border: 1px solid transparent;
            transition: var(--transition);
        }

        .search-box:focus-within {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .search-box i {
            color: var(--gray-400);
            font-size: 14px;
        }

        .search-box input {
            border: none;
            background: transparent;
            padding: 10px 12px;
            font-size: 14px;
            outline: none;
            width: 200px;
            color: var(--gray-800);
        }

        .search-box input::placeholder {
            color: var(--gray-400);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            background: var(--gray-200);
            color: var(--gray-700);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #16a34a;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-warning:hover {
            background: #d97706;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--gray-300);
            color: var(--gray-600);
        }

        .btn-outline:hover {
            background: var(--gray-100);
            border-color: var(--gray-400);
        }

        .btn-icon {
            padding: 8px 10px;
            border-radius: var(--radius-sm);
        }

        /* ---------- 统计卡片 ---------- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: white;
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition);
        }

        .stat-card:hover {
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }

        .stat-info h4 {
            font-size: 13px;
            font-weight: 500;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }

        .stat-info .number {
            font-size: 28px;
            font-weight: 700;
            color: var(--gray-900);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .stat-icon.blue {
            background: var(--primary-bg);
            color: var(--primary);
        }

        .stat-icon.green {
            background: var(--success-bg);
            color: var(--success);
        }

        .stat-icon.yellow {
            background: var(--warning-bg);
            color: var(--warning);
        }

        .stat-icon.red {
            background: var(--danger-bg);
            color: var(--danger);
        }

        /* ---------- 工具栏 ---------- */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-left h2 {
            font-size: 20px;
            font-weight: 600;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-group .btn {
            background: white;
            border: 1px solid var(--gray-200);
            color: var(--gray-600);
            padding: 6px 16px;
            font-weight: 500;
        }

        .filter-group .btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .filter-group .btn:hover:not(.active) {
            background: var(--gray-100);
        }

        .toolbar-right {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ---------- 表格 ---------- */
        .table-wrapper {
            background: white;
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .table-responsive {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        thead {
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
        }

        thead th {
            text-align: left;
            padding: 14px 20px;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--gray-500);
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid var(--gray-100);
            transition: var(--transition);
        }

        tbody tr:hover {
            background: var(--gray-50);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody td {
            padding: 14px 20px;
            vertical-align: middle;
            color: var(--gray-700);
        }

        .product-name {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .product-avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: var(--primary-bg);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .product-name .name {
            font-weight: 500;
            color: var(--gray-800);
        }

        .product-name .sku {
            font-size: 12px;
            color: var(--gray-400);
            display: block;
        }

        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-instock {
            background: var(--success-bg);
            color: var(--success);
        }

        .badge-low {
            background: var(--warning-bg);
            color: var(--warning);
        }

        .badge-out {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .badge-category {
            background: var(--gray-200);
            color: var(--gray-600);
        }

        .action-btns {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .action-btns .btn {
            padding: 4px 10px;
            font-size: 12px;
        }

        /* ---------- 空状态 ---------- */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-400);
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 16px;
            color: var(--gray-300);
        }

        .empty-state h3 {
            font-size: 18px;
            color: var(--gray-600);
            margin-bottom: 8px;
        }

        /* ---------- 模态框 ---------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: white;
            border-radius: var(--radius);
            max-width: 520px;
            width: 100%;
            padding: 32px;
            box-shadow: var(--shadow-lg);
            transform: scale(0.96) translateY(10px);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h3 {
            font-size: 20px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--gray-400);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
        }

        .modal-close:hover {
            background: var(--gray-100);
            color: var(--gray-700);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-sm);
            font-size: 14px;
            transition: var(--transition);
            background: white;
            color: var(--gray-800);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        /* ---------- Toast 通知 ---------- */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 380px;
            width: 100%;
        }

        .toast {
            background: var(--gray-900);
            color: white;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            animation: slideUp 0.35s ease;
            border-left: 4px solid var(--primary);
        }

        .toast.success {
            border-left-color: var(--success);
        }

        .toast.error {
            border-left-color: var(--danger);
        }

        .toast.warning {
            border-left-color: var(--warning);
        }

        .toast i {
            font-size: 18px;
        }

        .toast .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            font-size: 16px;
            padding: 0 4px;
        }

        .toast .toast-close:hover {
            color: white;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .navbar {
                padding: 14px 18px;
            }

            .navbar-brand {
                font-size: 18px;
            }

            .search-box input {
                width: 120px;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .stat-card {
                padding: 16px;
            }

            .stat-info .number {
                font-size: 22px;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar-left {
                flex-wrap: wrap;
            }

            .filter-group .btn {
                font-size: 12px;
                padding: 4px 12px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .modal {
                padding: 24px;
                margin: 12px;
            }

            thead th,
            tbody td {
                padding: 10px 14px;
                font-size: 13px;
            }

            .product-name .sku {
                display: none;
            }

            .action-btns .btn {
                padding: 2px 8px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .navbar-actions {
                width: 100%;
                flex-direction: column;
                align-items: stretch;
            }

            .search-box input {
                width: 100%;
            }

            .toolbar-right {
                width: 100%;
                justify-content: stretch;
            }

            .toolbar-right .btn {
                flex: 1;
                justify-content: center;
            }
        }

        /* ---------- 滚动条美化 ---------- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--gray-100);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--gray-300);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gray-400);
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- ====== 导航栏 ====== -->
        <nav class="navbar">
            <div class="navbar-brand">
                <i class="fas fa-warehouse"></i>
                智能仓库
                <span>v2.0</span>
            </div>
            <div class="navbar-actions">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="搜索商品名称 / SKU..." />
                </div>
                <button class="btn btn-primary" id="openAddModalBtn">
                    <i class="fas fa-plus"></i> 新增商品
                </button>
            </div>
        </nav>

        <!-- ====== 统计卡片 ====== -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-info">
                    <h4>总库存商品</h4>
                    <div class="number" id="totalItems">0</div>
                </div>
                <div class="stat-icon blue"><i class="fas fa-boxes"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h4>总数量</h4>
                    <div class="number" id="totalQuantity">0</div>
                </div>
                <div class="stat-icon green"><i class="fas fa-cubes"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h4>低库存预警</h4>
                    <div class="number" id="lowStockCount">0</div>
                </div>
                <div class="stat-icon yellow"><i class="fas fa-exclamation-triangle"></i></div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h4>品类数量</h4>
                    <div class="number" id="categoryCount">0</div>
                </div>
                <div class="stat-icon red"><i class="fas fa-tags"></i></div>
            </div>
        </div>

        <!-- ====== 工具栏 ====== -->
        <div class="toolbar">
            <div class="toolbar-left">
                <h2><i class="fas fa-list-ul" style="color:var(--primary);margin-right:8px;"></i>库存列表</h2>
                <div class="filter-group" id="filterGroup">
                    <button class="btn active" data-filter="all">全部</button>
                    <button class="btn" data-filter="instock">充足</button>
                    <button class="btn" data-filter="low">低库存</button>
                    <button class="btn" data-filter="out">缺货</button>
                </div>
            </div>
            <div class="toolbar-right">
                <button class="btn btn-outline btn-sm" id="exportBtn"><i class="fas fa-download"></i> 导出</button>
                <button class="btn btn-outline btn-sm" id="refreshBtn"><i class="fas fa-sync"></i> 刷新</button>
            </div>
        </div>

        <!-- ====== 表格 ====== -->
        <div class="table-wrapper">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>商品信息</th>
                            <th>分类</th>
                            <th>单价</th>
                            <th>库存</th>
                            <th>状态</th>
                            <th style="text-align:right;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <!-- 动态渲染 -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- ====== 模态框：新增 / 编辑 ====== -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">新增商品</h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <form id="productForm" autocomplete="off">
                <input type="hidden" id="editId" value="" />

                <div class="form-group">
                    <label for="prodName">商品名称 *</label>
                    <input type="text" id="prodName" placeholder="例：无线鼠标" required />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="prodSku">SKU *</label>
                        <input type="text" id="prodSku" placeholder="例：M-001" required />
                    </div>
                    <div class="form-group">
                        <label for="prodCategory">分类 *</label>
                        <select id="prodCategory" required>
                            <option value="电子产品">电子产品</option>
                            <option value="办公用品">办公用品</option>
                            <option value="日用百货">日用百货</option>
                            <option value="食品饮料">食品饮料</option>
                            <option value="服装鞋帽">服装鞋帽</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="prodPrice">单价 (元) *</label>
                        <input type="number" id="prodPrice" placeholder="0.00" step="0.01" min="0" required />
                    </div>
                    <div class="form-group">
                        <label for="prodQuantity">库存数量 *</label>
                        <input type="number" id="prodQuantity" placeholder="0" step="1" min="0" required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="prodMinStock">低库存阈值</label>
                    <input type="number" id="prodMinStock" placeholder="默认 5" step="1" min="0" value="5" />
                </div>

                <div class="form-group">
                    <label for="prodDesc">备注</label>
                    <textarea id="prodDesc" placeholder="可选填写商品备注信息..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="cancelModalBtn">取消</button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-save"></i> 保存
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ====== Toast 容器 ====== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        //  数据层
        // ============================================================
        const STORAGE_KEY = 'warehouse_products';

        // 默认示例数据
        const defaultProducts = [{
            id: '1',
            name: '无线静音鼠标',
            sku: 'M-1001',
            category: '电子产品',
            price: 39.90,
            quantity: 28,
            minStock: 5,
            desc: '办公家用，USB接收器'
        }, {
            id: '2',
            name: 'A4 打印纸 70g',
            sku: 'P-2023',
            category: '办公用品',
            price: 22.50,
            quantity: 3,
            minStock: 5,
            desc: '500张/包，中性纸'
        }, {
            id: '3',
            name: '不锈钢保温杯',
            sku: 'C-8802',
            category: '日用百货',
            price: 69.00,
            quantity: 12,
            minStock: 3,
            desc: '500ml，真空保温'
        }, {
            id: '4',
            name: '运动蓝牙耳机',
            sku: 'E-009',
            category: '电子产品',
            price: 159.00,
            quantity: 0,
            minStock: 5,
            desc: 'IPX5防水，续航8小时'
        }, {
            id: '5',
            name: '文件夹 10个装',
            sku: 'F-320',
            category: '办公用品',
            price: 18.00,
            quantity: 45,
            minStock: 10,
            desc: 'A4，蓝色'
        }];

        // 读取数据
        function loadProducts() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try { return JSON.parse(data); } catch { /* ignore */ }
            }
            // 首次使用写入默认数据
            localStorage.setItem(STORAGE_KEY, JSON.stringify(defaultProducts));
            return defaultProducts;
        }

        function saveProducts(products) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
        }

        // 生成短 id
        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        // ============================================================
        //  状态
        // ============================================================
        let products = loadProducts();
        let currentFilter = 'all';
        let searchKeyword = '';

        // ============================================================
        //  DOM 引用
        // ============================================================
        const tbody = document.getElementById('productTableBody');
        const totalItemsEl = document.getElementById('totalItems');
        const totalQuantityEl = document.getElementById('totalQuantity');
        const lowStockCountEl = document.getElementById('lowStockCount');
        const categoryCountEl = document.getElementById('categoryCount');

        const searchInput = document.getElementById('searchInput');
        const filterGroup = document.getElementById('filterGroup');
        const openAddModalBtn = document.getElementById('openAddModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const productModal = document.getElementById('productModal');
        const modalTitle = document.getElementById('modalTitle');
        const editId = document.getElementById('editId');
        const productForm = document.getElementById('productForm');
        const submitBtn = document.getElementById('submitBtn');

        const refreshBtn = document.getElementById('refreshBtn');
        const exportBtn = document.getElementById('exportBtn');

        // ============================================================
        //  工具函数
        // ============================================================
        function getStockStatus(product) {
            if (product.quantity <= 0) return 'out';
            if (product.quantity < product.minStock) return 'low';
            return 'instock';
        }

        function getStockLabel(product) {
            const status = getStockStatus(product);
            if (status === 'out') return { text: '缺货', cls: 'badge-out' };
            if (status === 'low') return { text: '低库存', cls: 'badge-low' };
            return { text: '充足', cls: 'badge-instock' };
        }

        // 筛选 & 搜索
        function getFilteredProducts() {
            return products.filter(p => {
                // 搜索
                const kw = searchKeyword.trim().toLowerCase();
                if (kw) {
                    const match = p.name.toLowerCase().includes(kw) ||
                        p.sku.toLowerCase().includes(kw) ||
                        p.category.toLowerCase().includes(kw);
                    if (!match) return false;
                }
                // 筛选
                if (currentFilter === 'instock') return getStockStatus(p) === 'instock';
                if (currentFilter === 'low') return getStockStatus(p) === 'low';
                if (currentFilter === 'out') return getStockStatus(p) === 'out';
                return true;
            });
        }

        // ============================================================
        //  渲染
        // ============================================================
        function render() {
            const filtered = getFilteredProducts();
            // 更新统计
            const total = products.length;
            const totalQty = products.reduce((sum, p) => sum + p.quantity, 0);
            const lowCount = products.filter(p => getStockStatus(p) === 'low' || getStockStatus(p) === 'out').length;
            const categories = new Set(products.map(p => p.category));
            totalItemsEl.textContent = total;
            totalQuantityEl.textContent = totalQty;
            lowStockCountEl.textContent = lowCount;
            categoryCountEl.textContent = categories.size;

            // 表格
            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="fas fa-box-open"></i>
                                <h3>暂无商品</h3>
                                <p style="color:var(--gray-400);font-size:14px;">点击「新增商品」添加第一个库存</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = filtered.map(p => {
                const status = getStockLabel(p);
                const avatarLetter = p.name.charAt(0).toUpperCase();
                return `
                    <tr>
                        <td>
                            <div class="product-name">
                                <div class="product-avatar">${avatarLetter}</div>
                                <div>
                                    <div class="name">${escapeHtml(p.name)}</div>
                                    <span class="sku">SKU: ${escapeHtml(p.sku)}</span>
                                </div>
                            </div>
                        </td>
                        <td><span class="badge badge-category">${escapeHtml(p.category)}</span></td>
                        <td>¥${p.price.toFixed(2)}</td>
                        <td><strong>${p.quantity}</strong></td>
                        <td><span class="badge ${status.cls}">${status.text}</span></td>
                        <td style="text-align:right;">
                            <div class="action-btns" style="justify-content:flex-end;">
                                <button class="btn btn-primary btn-sm edit-btn" data-id="${p.id}">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-success btn-sm in-btn" data-id="${p.id}">
                                    <i class="fas fa-arrow-down"></i> 入库
                                </button>
                                <button class="btn btn-warning btn-sm out-btn" data-id="${p.id}">
                                    <i class="fas fa-arrow-up"></i> 出库
                                </button>
                                <button class="btn btn-danger btn-sm delete-btn" data-id="${p.id}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');

            // 绑定行内按钮事件 (事件委托)
            // 但为了避免重复绑定，使用全局委托在 document 上处理
        }

        // 简单防 XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  事件委托 (行内按钮)
        // ============================================================
        document.addEventListener('click', function(e) {
            const target = e.target.closest('button');
            if (!target) return;

            // 编辑
            if (target.classList.contains('edit-btn')) {
                const id = target.dataset.id;
                openEditModal(id);
                return;
            }

            // 入库
            if (target.classList.contains('in-btn')) {
                const id = target.dataset.id;
                const product = products.find(p => p.id === id);
                if (!product) return;
                const qty = parseInt(prompt(`「${product.name}」入库数量：`, '1'));
                if (!isNaN(qty) && qty > 0) {
                    product.quantity += qty;
                    saveProducts(products);
                    render();
                    showToast(`✅ 入库成功：${product.name} +${qty}`, 'success');
                } else if (qty !== null) {
                    showToast('请输入有效的数量', 'warning');
                }
                return;
            }

            // 出库
            if (target.classList.contains('out-btn')) {
                const id = target.dataset.id;
                const product = products.find(p => p.id === id);
                if (!product) return;
                if (product.quantity <= 0) {
                    showToast(`⚠️ 「${product.name}」库存已为 0，无法出库`, 'error');
                    return;
                }
                const qty = parseInt(prompt(`「${product.name}」出库数量（当前库存 ${product.quantity}）：`, '1'));
                if (!isNaN(qty) && qty > 0) {
                    if (qty > product.quantity) {
                        showToast(`❌ 出库数量不能大于当前库存 (${product.quantity})`, 'error');
                        return;
                    }
                    product.quantity -= qty;
                    saveProducts(products);
                    render();
                    showToast(`📦 出库成功：${product.name} -${qty}`, 'success');
                } else if (qty !== null) {
                    showToast('请输入有效的数量', 'warning');
                }
                return;
            }

            // 删除
            if (target.classList.contains('delete-btn')) {
                const id = target.dataset.id;
                const product = products.find(p => p.id === id);
                if (!product) return;
                if (confirm(`确定要删除商品「${product.name}」吗？`)) {
                    products = products.filter(p => p.id !== id);
                    saveProducts(products);
                    render();
                    showToast(`🗑️ 已删除：${product.name}`, 'warning');
                }
                return;
            }
        });

        // ============================================================
        //  模态框逻辑
        // ============================================================
        function openModal(title, data = null) {
            modalTitle.textContent = title;
            if (data) {
                editId.value = data.id;
                document.getElementById('prodName').value = data.name;
                document.getElementById('prodSku').value = data.sku;
                document.getElementById('prodCategory').value = data.category;
                document.getElementById('prodPrice').value = data.price;
                document.getElementById('prodQuantity').value = data.quantity;
                document.getElementById('prodMinStock').value = data.minStock || 5;
                document.getElementById('prodDesc').value = data.desc || '';
                submitBtn.innerHTML = '<i class="fas fa-save"></i> 更新';
            } else {
                editId.value = '';
                productForm.reset();
                document.getElementById('prodMinStock').value = 5;
                submitBtn.innerHTML = '<i class="fas fa-plus"></i> 新增';
            }
            productModal.classList.add('active');
        }

        function closeModal() {
            productModal.classList.remove('active');
        }

        function openAddModal() {
            openModal('新增商品');
        }

        function openEditModal(id) {
            const product = products.find(p => p.id === id);
            if (!product) {
                showToast('商品不存在', 'error');
                return;
            }
            openModal('编辑商品', product);
        }

        // 模态框按钮
        openAddModalBtn.addEventListener('click', openAddModal);
        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);
        productModal.addEventListener('click', function(e) {
            if (e.target === productModal) closeModal();
        });

        // 表单提交
        productForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('prodName').value.trim();
            const sku = document.getElementById('prodSku').value.trim();
            const category = document.getElementById('prodCategory').value;
            const price = parseFloat(document.getElementById('prodPrice').value);
            const quantity = parseInt(document.getElementById('prodQuantity').value);
            const minStock = parseInt(document.getElementById('prodMinStock').value) || 5;
            const desc = document.getElementById('prodDesc').value.trim();
            const editIdVal = editId.value;

            // 校验
            if (!name || !sku) {
                showToast('请填写商品名称和 SKU', 'warning');
                return;
            }
            if (isNaN(price) || price < 0) {
                showToast('请输入有效的价格', 'warning');
                return;
            }
            if (isNaN(quantity) || quantity < 0) {
                showToast('请输入有效的库存数量', 'warning');
                return;
            }

            if (editIdVal) {
                // 编辑
                const index = products.findIndex(p => p.id === editIdVal);
                if (index === -1) {
                    showToast('商品不存在', 'error');
                    return;
                }
                // 检查 SKU 是否与其他商品冲突 (排除自身)
                const conflict = products.some((p, i) => p.sku === sku && i !== index);
                if (conflict) {
                    showToast('SKU 已存在，请更换', 'warning');
                    return;
                }
                products[index] = {
                    ...products[index],
                    name,
                    sku,
                    category,
                    price,
                    quantity,
                    minStock,
                    desc
                };
                saveProducts(products);
                render();
                closeModal();
                showToast(`✅ 已更新：${name}`, 'success');
            } else {
                // 新增
                const conflict = products.some(p => p.sku === sku);
                if (conflict) {
                    showToast('SKU 已存在，请更换', 'warning');
                    return;
                }
                const newProduct = {
                    id: generateId(),
                    name,
                    sku,
                    category,
                    price,
                    quantity,
                    minStock,
                    desc
                };
                products.push(newProduct);
                saveProducts(products);
                render();
                closeModal();
                showToast(`🎉 新增成功：${name}`, 'success');
            }
        });

        // ============================================================
        //  搜索 & 筛选
        // ============================================================
        searchInput.addEventListener('input', function() {
            searchKeyword = this.value;
            render();
        });

        filterGroup.addEventListener('click', function(e) {
            const btn = e.target.closest('button');
            if (!btn || !btn.dataset.filter) return;
            filterGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            render();
        });

        // ============================================================
        //  刷新 & 导出
        // ============================================================
        refreshBtn.addEventListener('click', function() {
            products = loadProducts();
            render();
            showToast('🔄 已刷新数据', 'success');
        });

        exportBtn.addEventListener('click', function() {
            const filtered = getFilteredProducts();
            if (filtered.length === 0) {
                showToast('没有数据可导出', 'warning');
                return;
            }
            // 生成 CSV
            const headers = ['名称', 'SKU', '分类', '单价', '库存', '阈值', '状态', '备注'];
            const rows = filtered.map(p => {
                const status = getStockLabel(p).text;
                return [p.name, p.sku, p.category, p.price.toFixed(2), p.quantity, p.minStock, status, p.desc || ''];
            });
            let csv = headers.join(',') + '\n';
            rows.forEach(row => {
                csv += row.map(v => `"${v}"`).join(',') + '\n';
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' }); // BOM 支持 Excel
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `仓库库存_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
            showToast('📥 导出成功', 'success');
        });

        // ============================================================
        //  Toast 通知
        // ============================================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const iconMap = {
                success: 'fas fa-check-circle',
                error: 'fas fa-times-circle',
                warning: 'fas fa-exclamation-circle',
                info: 'fas fa-info-circle'
            };
            const icon = iconMap[type] || iconMap.info;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="${icon}"></i>
                <span>${message}</span>
                <button class="toast-close">&times;</button>
            `;
            container.appendChild(toast);

            // 自动移除
            const timer = setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 3500);

            toast.querySelector('.toast-close').addEventListener('click', function() {
                clearTimeout(timer);
                toast.remove();
            });

            // 点击移除
            toast.addEventListener('click', function() {
                clearTimeout(timer);
                toast.remove();
            });
        }

        // ============================================================
        //  初始化
        // ============================================================
        render();

        // 如果没有任何数据，显示一条提示
        if (products.length === 0) {
            showToast('📋 仓库空空如也，添加第一个商品吧！', 'info');
        }

        console.log('🏗️ 智能仓库管理系统 v2.0 已启动');
        console.log(`📦 当前库存: ${products.length} 种商品`);
    </script>

</body>
</html>
